    :root { background: #000000; color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #000000; user-select: none; -webkit-user-select: none;
    }
    #art {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      touch-action: none; cursor: default; background: #000000;
    }
    #art.interactive { cursor: grab; }
    #art.dragging { cursor: grabbing; }
    #art.send-ready { cursor: pointer; }
    canvas {
      position: absolute; inset: 0; display: block;
      width: 100%; height: 100%; pointer-events: none;
    }
    canvas[hidden] { display: none; }

    #audio-tip {
      position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top, 18px));
      transform: translateX(-50%) translateY(-6px);
      padding: 6px 14px; border-radius: 999px;
      background: rgba(16, 12, 22, 0.62);
      border: 1px solid rgba(255, 220, 238, 0.22);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font: 500 12px/1.3 "PingFang SC", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0.1em; color: rgba(255, 236, 246, 0.86);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 12;
    }
    #audio-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #send-prompt {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 20px));
      transform: translateX(-50%) translateY(8px);
      padding: 7px 16px; border-radius: 999px;
      background: rgba(18, 12, 24, 0.68);
      border: 1px solid rgba(255, 206, 230, 0.30);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font: 500 12.5px/1.3 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.12em; color: #fff2f8;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 12;
    }
    #send-prompt.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #hud {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 18px));
      transform: translateX(-50%) translateY(12px);
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(12, 10, 18, 0.64);
      border: 1px solid rgba(255, 224, 240, 0.22);
      backdrop-filter: blur(16px) saturate(135%);
      -webkit-backdrop-filter: blur(16px) saturate(135%);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 245, 250, 0.14);
      opacity: 0; pointer-events: none; touch-action: manipulation;
      transition: opacity 1.1s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1);
      z-index: 25; max-width: calc(100vw - 16px);
    }
    #hud.visible { opacity: 0.78; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    #hud.visible:hover, #hud.visible:focus-within { opacity: 1; }
    #hud button {
      appearance: none; border: 0; background: transparent;
      color: rgba(255, 242, 248, 0.92);
      font: 500 12px/1 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.06em; padding: 8px 10px; border-radius: 999px;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      white-space: nowrap; flex-shrink: 0; touch-action: manipulation;
      transition: background 0.25s ease, color 0.25s ease;
    }
    #hud button:hover { background: rgba(255, 210, 234, 0.16); color: #ffffff; }
    #hud button.active { background: rgba(248, 180, 218, 0.26); color: #fff6fc; }
    #hud .sep { width: 1px; height: 14px; flex-shrink: 0; background: rgba(255, 224, 238, 0.20); margin: 0 2px; }
    .theme-dots { display: inline-flex; align-items: center; gap: 0; padding: 0 2px; flex-shrink: 0; }
    .theme-dot {
      position: relative;
      width: 24px !important; height: 30px !important; padding: 0 !important;
      border-radius: 50% !important; background: transparent !important; border: 0 !important;
    }
    .theme-dot:hover { background: rgba(255, 230, 245, 0.10) !important; }
    .theme-dot::after {
      content: ""; display: block; width: 13px; height: 13px; border-radius: 50%;
      border: 1.5px solid rgba(255, 250, 252, 0.52);
      pointer-events: none;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .theme-dot:hover::after { transform: scale(1.16); }
    .theme-dot:active::after { transform: scale(0.92); }
    .theme-dot[data-theme="sakura"]::after    { background: radial-gradient(circle at 35% 35%, #fff4fa, #f6a0cf); }
    .theme-dot[data-theme="aurora"]::after    { background: radial-gradient(circle at 35% 35%, #eef7ff, #7ebdf5); }
    .theme-dot[data-theme="velvet"]::after    { background: radial-gradient(circle at 35% 35%, #ffe6f4, #d45e9e); }
    .theme-dot[data-theme="lavender"]::after  { background: radial-gradient(circle at 35% 35%, #f5eeff, #b388f5); }
    .theme-dot[data-theme="emerald"]::after   { background: radial-gradient(circle at 35% 35%, #ecfff8, #58d9b2); }
    .theme-dot[data-theme="champagne"]::after { background: radial-gradient(circle at 35% 35%, #fffaf2, #e6c6a0); }
    .theme-dot[data-theme="diamond"]::after   { background: radial-gradient(circle at 35% 35%, #ffffff, #b8c8dc); }
    .theme-dot.active { background: transparent !important; }
    .theme-dot.active::after {
      transform: scale(1.24); border-color: #ffffff;
      box-shadow: 0 0 11px rgba(255, 232, 246, 0.95);
    }

    #hint {
      position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom, 18px)) + 52px);
      transform: translateX(-50%);
      font: 500 12px/1.4 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.14em; color: rgba(255, 236, 246, 0.72);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity 1.3s ease; z-index: 11;
    }
    #hint.show { opacity: 1; }

    #wish-bar {
      position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom, 18px)) + 54px);
      transform: translateX(-50%) translateY(8px);
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px 6px 14px; border-radius: 999px;
      background: rgba(16, 12, 24, 0.78);
      border: 1px solid rgba(255, 220, 238, 0.28);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease; z-index: 18;
    }
    #wish-bar.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    #wish-input {
      appearance: none; border: 0; outline: 0; background: transparent;
      color: #fffaff; width: 175px;
      font: 500 13px/1.3 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.08em;
    }
    #wish-input::placeholder { color: rgba(255, 224, 240, 0.50); }
    #wish-submit {
      appearance: none; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer;
      background: linear-gradient(135deg, #f8b2d6, #ea8ec0); color: #ffffff;
      font: 500 12px/1 "PingFang SC", "Microsoft YaHei UI", sans-serif; letter-spacing: 0.1em;
      box-shadow: 0 4px 14px rgba(240, 148, 200, 0.38);
      transition: transform 0.18s ease, filter 0.2s ease;
    }
    #wish-submit:hover { filter: brightness(1.08); }
    #wish-submit:active { transform: scale(0.95); }

    /* Snow Letter Modal */
    #letter-backdrop {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.55s cubic-bezier(.22,1,.36,1);
    }
    #letter-backdrop.open { opacity: 1; pointer-events: auto; }
    #letter-card {
      position: relative; width: min(420px, calc(100vw - 36px));
      padding: 34px 30px 28px; border-radius: 22px; color-scheme: light;
      background: linear-gradient(160deg, rgba(255, 252, 254, 0.95), rgba(253, 240, 247, 0.92) 55%, rgba(248, 232, 243, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(218, 156, 192, 0.28);
      color: #5d3e52;
      transform: translateY(16px) scale(0.96);
      transition: transform 0.55s cubic-bezier(.22,1,.36,1); overflow: hidden;
    }
    #letter-backdrop.open #letter-card { transform: translateY(0) scale(1); }
    #letter-card::before {
      content: ""; position: absolute; inset: 10px; border-radius: 15px;
      border: 1px solid rgba(210, 148, 184, 0.28); pointer-events: none;
    }
    .letter-crest { text-align: center; margin-bottom: 14px; color: #c57ea6; font-size: 13px; letter-spacing: 0.25em; }
    .letter-couple { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .letter-av {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 2px solid #fff8fc; box-shadow: 0 4px 14px rgba(190, 114, 160, 0.28);
    }
    .letter-heart { font-size: 14px; color: #e07db2; text-shadow: 0 0 10px rgba(242, 148, 198, 0.65); }
    .letter-crest-title {
      display: block; margin-top: 6px;
      font: 400 24px/1.2 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "Noto Serif CJK SC", serif;
      letter-spacing: 0.28em; color: #7a4c68;
    }
    .letter-salutation { font: 500 16px/1.8 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; color: #6b435c; margin: 10px 0 8px; }
    .letter-body {
      font: 400 15.5px/1.95 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "Noto Serif CJK SC", serif;
      color: #5e3e54; margin: 0; letter-spacing: 0.05em;
      max-height: 44vh; overflow-y: auto; padding-right: 4px;
    }
    .letter-body p { margin: 0 0 11px; white-space: pre-wrap; word-break: break-word; }
    .letter-footer { margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .letter-time { font: 500 11.5px/1.4 "PingFang SC", system-ui, sans-serif; color: rgba(132, 92, 118, 0.75); letter-spacing: 0.14em; }
    .letter-sign { text-align: right; font: 500 16.5px/1.5 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; color: #7d4a6a; letter-spacing: 0.12em; }
    .letter-seal {
      display: inline-block; margin-left: 8px; padding: 2px 6px; border-radius: 4px;
      border: 1.2px solid #cf6e9a; color: #cf6e9a;
      font: 500 11px/1.15 "Kaiti SC", "KaiTi", serif; letter-spacing: 0.1em; vertical-align: middle;
      background: rgba(224, 120, 172, 0.08);
    }
    #letter-edit-btn {
      position: absolute; top: 14px; left: 16px; height: 28px; padding: 0 11px; border-radius: 999px;
      border: 1px solid rgba(196, 128, 168, 0.28); background: rgba(255, 255, 255, 0.52);
      color: #7c526d; font: 500 11.5px/26px "PingFang SC", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0.06em; cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }
    #letter-edit-btn:hover { background: rgba(246, 198, 224, 0.36); border-color: rgba(206, 118, 166, 0.52); transform: scale(1.03); }
    #letter-close {
      position: absolute; top: 14px; right: 16px; width: 28px; height: 28px; border-radius: 50%;
      border: 0; background: rgba(164, 112, 146, 0.12); color: #7c526d; font-size: 15px; line-height: 28px;
      cursor: pointer; text-align: center; transition: background 0.2s ease, transform 0.2s ease;
    }
    #letter-close:hover { background: rgba(164, 112, 146, 0.24); transform: scale(1.06); }

    /* Custom Handwritten Letter Editor Mode */
    #letter-editor { display: none; margin-top: 6px; }
    #letter-card.editing #letter-view,
    #letter-card.editing #letter-edit-btn,
    #letter-card.editing #letter-title { display: none; }
    #letter-card.editing #letter-editor { display: block; }
    #letter-editor input, #letter-editor textarea {
      width: 100%; border: 1px dashed rgba(196, 124, 166, 0.48); border-radius: 10px;
      background: rgba(255, 255, 255, 0.68); color: #5e3e54; outline: none;
      padding: 7px 11px; margin-bottom: 8px;
      user-select: text; -webkit-user-select: text;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    #letter-editor input:focus, #letter-editor textarea:focus {
      border-style: solid; border-color: #df82b4; background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 0 3px rgba(244, 164, 208, 0.20);
    }
    .ed-title {
      text-align: center; letter-spacing: 0.24em;
      font: 400 18px/1.3 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    }
    .ed-salutation { font: 500 15px/1.4 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif; }
    .ed-body {
      min-height: 146px; max-height: 32vh; resize: vertical;
      font: 400 14.5px/1.8 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      letter-spacing: 0.04em;
    }
    .ed-row { display: grid; grid-template-columns: 1.25fr 1fr 0.85fr; gap: 6px; }
    .ed-row input { font: 500 12.5px/1.3 "PingFang SC", "Kaiti SC", sans-serif; padding: 6px 8px; }
    .ed-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .ed-actions-left, .ed-actions-right { display: flex; align-items: center; gap: 6px; }
    .ed-btn {
      appearance: none; border-radius: 999px; padding: 6px 12px; cursor: pointer;
      font: 500 12px/1.2 "PingFang SC", "Microsoft YaHei UI", sans-serif; letter-spacing: 0.04em;
      border: 1px solid rgba(190, 124, 162, 0.34); background: rgba(255, 255, 255, 0.65); color: #744963;
      transition: background 0.2s ease, transform 0.16s ease, filter 0.2s ease;
    }
    .ed-btn:hover { background: rgba(248, 210, 232, 0.45); }
    .ed-btn:active { transform: scale(0.96); }
    .ed-btn.primary {
      border: 0; color: #ffffff;
      background: linear-gradient(135deg, #f5a3ce, #e17bb3);
      box-shadow: 0 5px 14px rgba(226, 124, 178, 0.36);
      padding: 7px 15px;
    }
    .ed-btn.primary:hover { filter: brightness(1.06); }

    #toast {
      position: fixed; left: 50%; top: max(24px, env(safe-area-inset-top, 24px));
      transform: translateX(-50%) translateY(-10px);
      padding: 8px 18px; border-radius: 999px;
      background: rgba(16, 12, 24, 0.78);
      border: 1px solid rgba(255, 224, 240, 0.26);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: #fff8fc; font: 500 12.5px/1.3 "PingFang SC", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0.1em; opacity: 0; pointer-events: none; z-index: 40;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

function glow(ctx, x, y, rx, ry, stops) {
  ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry);
  const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (const [at, color] of stops) gradient.addColorStop(at, color);

  ctx.lineWidth = Math.max(0.55, radius * 0.062);

const phoneLayer = { w: 534, h: 914, scale: 1.5, maskW: 204, maskH: 350 };
const chatFont = 27.5;
const chatFontFamily = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", "SnowChat", sans-serif';
const chatTextStyle = "500 " + chatFont + "px " + chatFontFamily;
const firstCrystalPoint = {};

function posePhone(p) {
  const floatStrength = 1 - smooth(ACT.melt - 2.0, ACT.melt + 1.5, t);
  p.x = CX;
  p.y = H * 0.485 + Math.sin(stageTime * 1.35) * 3.0 * floatStrength;
  p.rot = Math.sin(stageTime * 0.85) * 0.0045 * floatStrength;
  return p;
}
function fromPhone(x, y, point) {
  posePhone(phonePoint);
  const c = Math.cos(phonePoint.rot || 0), s = Math.sin(phonePoint.rot || 0);
  point.x = phonePoint.x + (x * c - y * s) * phoneCssScale;
  point.y = phonePoint.y + (x * s + y * c) * phoneCssScale;
  return point;
}
function componentAlpha(birth, fade = 0.82) { return 1 - smooth(birth - fade, birth + fade, t); }
function phoneOpacity() { return 1 - smooth(32.8, 35.8, t); }
function phoneMaterialTime(x, y) {
  const height = clamp((416 - y) / 845);
  const rise = ACT.melt + 12.2 * (1 - (1 - height) ** 1.52);
  const edge = 3.0 * smooth(105, 239, Math.abs(x)) * smooth(0.05, 0.56, height);
  const crinkle = 1.10 * Math.sin(x * 0.021 + y * 0.022)
    + 0.80 * Math.sin(x * 0.039 - y * 0.028)
    + 0.36 * Math.sin(x * 0.118 + Math.sin(y * 0.079) * 1.7)
    + 0.18 * Math.sin(x * 0.262 - y * 0.218);
  return Math.max(ACT.melt - 0.1, rise - edge + crinkle);
}
function makeErosionBuffer() {
  const { w, h, scale, maskW, maskH } = phoneLayer;
  phoneLayer.raster = surface(w * scale, h * scale);
  phoneLayer.draw = phoneLayer.raster.getContext("2d");
  phoneLayer.draw.setTransform(scale, 0, 0, scale, w * scale / 2, h * scale / 2);
  phoneLayer.mask = surface(maskW, maskH);
  phoneLayer.matte = phoneLayer.mask.getContext("2d");
  phoneLayer.pixels = phoneLayer.matte.createImageData(maskW, maskH);
  phoneLayer.rimMask = surface(maskW, maskH);
  phoneLayer.rimCtx = phoneLayer.rimMask.getContext("2d");
  phoneLayer.rimPixels = phoneLayer.rimCtx.createImageData(maskW, maskH);
  phoneLayer.births = new Float32Array(maskW * maskH);
  for (let y = 0; y < maskH; y++) {
    for (let x = 0; x < maskW; x++) {
      phoneLayer.births[y * maskW + x] = phoneMaterialTime(
        (x + 0.5) * w / maskW - w / 2, (y + 0.5) * h / maskH - h / 2
      );
    }
  }
}
function erodedPhone() {
  const { w, h, draw, mask, matte, pixels, rimMask, rimCtx, rimPixels, births } = phoneLayer;
  draw.clearRect(-w / 2, -h / 2, w, h);
  drawPhoneContents(draw);
  const data = pixels.data, rim = rimPixels.data;
  for (let i = 0; i < births.length; i++) {
    const at = births[i], idx = i * 4;
    data[idx + 3] = Math.round(255 * (1 - smooth(at - 1.15, at + 0.85, t)));
    const edgeGlow = pulse(at - 1.55, at - 0.55, at - 0.05, at + 0.82, t);
    if (edgeGlow > 0.01) {
      rim[idx] = 255; rim[idx + 1] = 236; rim[idx + 2] = 248;
      rim[idx + 3] = Math.round(240 * edgeGlow);
    } else rim[idx + 3] = 0;
  }
  matte.putImageData(pixels, 0, 0);
  rimCtx.putImageData(rimPixels, 0, 0);

    }

    chatBubble(ctx, row, y);
    ctx.fillStyle = PHONE.ink; ctx.fillText(row.text, row.x + 13, y + 0.5);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function firstSnow() {

// 3. 54,400-PARTICLE 3D GALAXY PINK-CRYSTAL TREE + SPIRAL RIBBON + HEART TOPPER

const treePos = new Float32Array(TOTAL_PARTICLES * 3);
const treeSeed = new Float32Array(TOTAL_PARTICLES * 4);
const treeRole = new Float32Array(TOTAL_PARTICLES); // 0=cone, 1=spiralRibbon, 2=heartTopper, 3=galaxyFloor, 4=spaceSnow
const sourceData = new Float32Array(TOTAL_PARTICLES * 4);

function buildGalaxyTreeParticles() {
  const rng = random(20260520);
  let idx = 0;
  function push(x, y, z, role, s0, s1, s2, s3) {
    const p3 = idx * 3, p4 = idx * 4;
    treePos[p3] = x; treePos[p3 + 1] = y; treePos[p3 + 2] = z;
    treeSeed[p4] = s0; treeSeed[p4 + 1] = s1; treeSeed[p4 + 2] = s2; treeSeed[p4 + 3] = s3;
    treeRole[idx] = role;
    idx++;
  }

  // A. Sculpted Couture 8-Tier Crystalline Christmas Tree (22,000 particles)
  // Cascading scalloped crystalline boughs + luminous inner diamond spine + frosted branch tips!
  for (let i = 0; i < COUNTS.cone; i++) {
    const h = rng() ** 0.82;
    const rMax = 1.92 * (1.0 - h) ** 1.24 + 0.030;
    const isSpine = rng() < 0.10;
    const angle = rng() * TAU;
    let r, y;
    if (isSpine) {
      // Delicate luminous translucent inner crystal core giving true 3D depth!
      r = (0.04 + 0.24 * rng()) * rMax;
      y = TREE.base + h * TREE.height + (rng() - 0.5) * 0.08;
    } else {
      // 8 cascading scalloped pine-bough tiers with subtle 7-petal bough ridges & graceful drooping tips
      const tierCount = 7.6;
      const tierFrac = (h * tierCount) % 1.0;
      const tierFlare = 0.74 + 0.38 * (1.0 - tierFrac) ** 0.72;
      const boughStar = 1.0 + 0.095 * Math.cos(angle * 7.0 + Math.floor(h * tierCount) * 1.15);
      const shell = rng() < 0.78 ? (0.58 + 0.42 * rng() ** 0.38) : (0.18 + 0.52 * rng());
      r = rMax * tierFlare * boughStar * shell;
      const droop = -0.22 * (r / Math.max(0.14, rMax)) * (1.0 - h * 0.48);
      y = TREE.base + h * TREE.height + droop + (rng() - 0.5) * 0.068;
    }
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    push(x, y, z, 0.0, rng(), rng(), isSpine ? 0.99 : rng(), rng());
  }

  // B. Tapered Silk-Organza 3D Spiral Ribbon + Diamond-Dust Edge Filaments (14,500 particles)
  // Sleek & refined near the spire, blossoming into plush luminous snow-silk bands toward the base!
  for (let i = 0; i < COUNTS.ribbon; i++) {
    const u = rng() ** 0.86;
    const h = 0.012 + u * 0.945;
    const turns = 5.25;
    const theta = h * turns * TAU;
    const rBase = 2.02 * (1.0 - h) ** 1.20 + 0.095;
    const isHaloDust = rng() < 0.14;
    const bandH = (0.215 * (1.0 - h * 0.68) + 0.036);
    const bandR = (0.115 * (1.0 - h * 0.56) + 0.028);
    const offY = isHaloDust ? (rng() * 2.0 - 1.0) * bandH * 1.65 : (rng() + rng() - 1.0) * bandH;
    const offR = isHaloDust ? (0.04 + rng() * bandR * 1.8) : (rng() + rng() - 1.0) * bandR;
    const r = rBase + offR;
    const x = Math.cos(theta) * r;
    const z = Math.sin(theta) * r;
    const y = TREE.base + h * TREE.height + offY;
    const edgeMetric = isHaloDust ? 0.92 : Math.min(1.0, Math.abs(offY / bandH));
    push(x, y, z, 1.0, rng(), rng(), edgeMetric, rng());
  }

  // C. Jewel-Cut Plump 3D Volumetric Crystal Heart Topper + Orbiting Stardust (4,000 particles)
  for (let i = 0; i < COUNTS.heart; i++) {
    const a = rng() * TAU;
    const hx = 16.0 * Math.sin(a) ** 3;
    const hy = 13.0 * Math.cos(a) - 5.0 * Math.cos(2 * a) - 2.0 * Math.cos(3 * a) - Math.cos(4 * a);
    const isAuraMote = i >= COUNTS.heart - 220;
    const fill = isAuraMote ? (1.08 + rng() * 0.34) : (rng() < 0.52 ? (0.82 + 0.18 * rng()) : (rng() ** 0.50));
    const scaleH = 0.033;
    const x = hx * fill * scaleH;
    const y = TREE.heartY + (hy + 2.2) * fill * scaleH;
    const maxZ = isAuraMote ? 0.24 : Math.sqrt(Math.max(0.0, 1.0 - Math.min(1.0, fill * fill * 0.74))) * 0.23;
    const z = (rng() * 2.0 - 1.0) * maxZ;
    push(x, y, z, 2.0, rng(), rng(), Math.min(1.0, fill), rng());
  }

  // D. Sweeping High-Angle Curved Planetary Galaxy Floor & Concentric Crystal Rings (22,100 particles)
  for (let i = 0; i < COUNTS.floor; i++) {
    let r, angle = rng() * TAU, isRing = 0.0;
    const roll = i / COUNTS.floor;
    if (roll < 0.15) {
      // Crisp inner crystal halo ring right under the bottom spiral
      r = 1.20 + (rng() + rng()) * 0.30;
      isRing = 0.92;
    } else if (roll < 0.52) {
      // Iconic bold glowing crystal outer halo ring (separated by a dramatic dark moat!)
      const g = (rng() + rng() - 1.0);
      r = 2.95 + g * 0.68;
      isRing = 1.0 - Math.min(1.0, Math.abs(g) * 0.78);
    } else {
      // Vast curved starry planetary snowfield with subtle 4-arm cosmic spiral swirl!
      r = 3.30 + rng() ** 0.64 * 9.6;
      if (rng() < 0.45) {
        const arm = Math.floor(rng() * 4) * (TAU / 4);
        angle = arm + r * 0.42 + (rng() + rng() - 1.0) * 0.48;
      }
      isRing = 0.08;
    }
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    // Gentle planetary dome curvature arching smoothly across the horizon under high-angle pitch!
    const domeDrop = -0.022 * r * r;
    const y = TREE.base - 0.04 + domeDrop + (rng() - 0.5) * (isRing > 0.4 ? 0.13 : 0.085);
    push(x, y, z, 3.0, rng(), rng(), isRing, rng());
  }

  // E. 3D Volumetric Starfield & Crisp Floating Foreground Snow Bokeh Orbs (2,400 particles)
  for (let i = 0; i < COUNTS.spaceSnow; i++) {
    const isHeroOrb = i < 24;
    const x = (rng() - 0.5) * (isHeroOrb ? 13.5 : 22.0);
    const y = -2.8 + rng() * 10.6;
    const z = isHeroOrb ? (0.8 + rng() * 3.2) : (-8.0 + rng() * 11.5);
    push(x, y, z, 4.0, rng(), rng(), isHeroOrb ? 1.0 : 0.0, rng());
  }
}
buildGalaxyTreeParticles();

function associateSources() {
  const rng = random(832124);
  for (let i = 0; i < TOTAL_PARTICLES; i++) {
    const role = treeRole[i];
    if (role > 3.5) {
      // Space snow drifts naturally in 3D from melt onset
      sourceData.set([0, 0, 21.5 + rng() * 14.0, 1.0], i * 4);

    }
    const pick = phoneFlecks[Math.floor(rng() * phoneFlecks.length)];
    // Floor forms first, then cone & ribbon rise, then heart crowns the apex!
    const roleOffset = role === 3.0 ? -1.4 : (role === 2.0 ? 3.2 : (role === 1.0 ? 1.2 : 0.2));
    const birth = Math.max(ACT.melt, pick[2] + roleOffset * 0.65);
    sourceData.set([pick[0] + (rng() - 0.5) * 1.2, pick[1] + (rng() - 0.5) * 1.2, birth, pick[3]], i * 4);
  }
}

// =========================================================================
// 4. UNIFIED HIGH-ANGLE 3D WEBGL SHADER (PURE CRYSTAL SPARKLE + BOKEH)
// =========================================================================
const VERTEX = `
attribute vec3 aPos;
attribute vec4 aSeed;
attribute vec4 aSource;
attribute float aRole;

uniform vec2 viewport, treeCenter, phoneCenter, rippleOrigin;
uniform vec3 uPetal, uBlush, uDeep, uHeart, uRing;
uniform float unit, clock, act, turn, tilt, zoom, heartBeat, clickWave, phoneScale;

varying vec4 vCol;
varying float vShape; // 0=soft crisp crystal dot, 1=bright glowing snow bokeh orb, 2=4-pt diamond glint
varying float vSpin;

const float TAU = 6.28318530718;

vec2 phonePt(vec2 p) { return phoneCenter + phoneScale * p; }
vec2 cubic(vec2 a, vec2 b, vec2 c, vec2 d, float u) {
  return mix(mix(mix(a,b,u),mix(b,c,u),u),mix(mix(b,c,u),mix(c,d,u),u),u);
}

void main() {
  float role = aRole;
  float birth = aSource.z;
  vec3 pos = aPos;

  // Ambient 3D falling snow drifts continuously in world space
  if (role > 3.5) {
    float speed = 0.22 + aSeed.w * 0.42;
    pos.y = mod(pos.y - clock * speed + 3.4, 10.6) - 3.4;
    pos.x += sin(clock * 0.45 + aSeed.x * TAU) * 0.28;
    pos.z += cos(clock * 0.38 + aSeed.y * TAU) * 0.22;
  } else if (role > 1.5 && role < 2.5) {
    // Heart topper pulses warmly & ALWAYS faces viewer with a gentle 3D rock (never goes edge-on!)
    float hb = 1.0 + 0.055 * sin(clock * 2.4);
    float ha = -turn + 0.24 * sin(clock * 1.15);
    float hc = cos(ha), hs = sin(ha);
    vec2 hxz = vec2(pos.x * hc - pos.z * hs, pos.x * hs + pos.z * hc);
    pos.x = hxz.x * hb;
    pos.z = hxz.y * hb;
    pos.y = ${TREE.heartY.toFixed(2)} + (pos.y - ${TREE.heartY.toFixed(2)}) * hb;
  } else if (role > 2.5 && role < 3.5) {
    // Galaxy floor rotates very slowly & gently breathes in height
    float fa = -clock * 0.06;
    float fc = cos(fa), fs = sin(fa);
    vec2 fxz = vec2(pos.x * fc - pos.z * fs, pos.x * fs + pos.z * fc);
    pos.x = fxz.x; pos.z = fxz.y;
    pos.y += 0.025 * sin(clock * 1.1 + length(pos.xz) * 1.8);
  } else {
    // Tree cone & spiral ribbon gentle living breath
    float h = clamp((pos.y - ${TREE.base.toFixed(2)}) / ${TREE.height.toFixed(2)}, 0.0, 1.0);
    pos.xz *= 1.0 + 0.014 * sin(clock * 1.1 + h * 6.0 + aSeed.w * 2.0);
  }

  // High-angle downward 3D perspective camera transform (positive tilt looks DOWN onto the tree & galaxy floor!)
  float cy = cos(turn), sy = sin(turn);
  float xr = pos.x * cy - pos.z * sy;
  float zr = pos.x * sy + pos.z * cy;
  float ct = cos(tilt), st = sin(tilt);
  // Looking DOWN from above: far z (< 0) rises HIGHER (+yr), near z (> 0) drops LOWER (-yr)!
  float yr = pos.y * ct - zr * st;
  float zp = pos.y * st + zr * ct;

  float persp = 8.4 / max(2.8, 8.4 - zp);
  float nearClip = 1.0 - smoothstep(4.2, 5.8, zp);
  vec2 goal = treeCenter + vec2(xr, -yr) * persp * unit * zoom;

  float u = 1.0;
  vec2 point = goal;
  float appear = 1.0;

  if (role > 3.5) {
    appear = smoothstep(23.0, 38.0, act);
  } else {
    float hNorm = clamp((aPos.y - ${TREE.base.toFixed(2)}) / ${TREE.height.toFixed(2)}, 0.0, 1.0);
    float arrive = birth + 4.2 + hNorm * 3.1 + aSeed.w * 1.45;
    u = smoothstep(birth, arrive, act);
    appear = smoothstep(birth, birth + 0.35, act);
    vec2 origin = phonePt(aSource.xy);
    float wave = sin(u * 3.14159265);
    float spin = aSeed.x * TAU + clock * 0.82 + u * 9.2;
    float sweep = (aSeed.y - 0.45) * 2.1 + (origin.x - treeCenter.x) / max(1.0, unit) * 0.25;
    vec2 cp1 = origin + vec2(sweep * 0.35, -0.75 - aSeed.z * 0.5) * unit;
    vec2 cp2 = mix(origin, goal, 0.58) + vec2(sweep, 0.45 - hNorm * 0.32) * unit;
    vec2 wind = vec2(cos(spin) * (0.58 + aSeed.z * 0.85), sin(spin) * (0.20 + aSeed.w * 0.26));
    point = cubic(origin, cp1, cp2, goal, u) + wind * pow(max(0.0, wave), 1.3) * unit;
  }

  gl_Position = vec4(point / viewport * vec2(2.0, -2.0) + vec2(-1.0, 1.0), 0.0, 1.0);

  // Ripples (heartbeat + interactive user click wave)
  float radial = length(aPos.xz);
  float hNorm = clamp((aPos.y - ${TREE.base.toFixed(2)}) / ${TREE.height.toFixed(2)}, 0.0, 1.0);
  float hbWave = max(0.0, 1.0 - abs(radial * 0.48 + abs(hNorm - 0.42) * 0.45 - heartBeat * 1.65) * 6.5);
  hbWave *= smoothstep(0.0, 0.12, heartBeat) * (1.0 - smoothstep(0.68, 1.0, heartBeat));
  float clickDist = length(point - rippleOrigin) / max(1.0, unit * 3.2);
  float clickPulse = max(0.0, 1.0 - abs(clickDist - clickWave * 1.55) * 6.0);
  clickPulse *= smoothstep(0.0, 0.08, clickWave) * (1.0 - smoothstep(0.65, 1.0, clickWave));
  float waveBoost = min(1.2, hbWave + clickPulse * 1.2);

  float twinkle = pow(max(0.0, sin(clock * (1.2 + aSeed.y * 2.8) + aSeed.x * 57.0)), 5.0);
  float depthFade = clamp(0.42 + zp * 0.16, 0.18, 1.0);
  vec3 white = vec3(1.0, 0.992, 1.0);
  vec3 col = white;
  float alpha = 0.8;
  float size = 1.6;
  float shape = 0.0;

  if (role < 0.5) {
    // Sculpted 8-tier crystal tree cone + luminous inner diamond spine
    float outer = clamp(radial / max(0.08, 1.92 * pow(max(0.02, 1.0 - hNorm), 1.24)), 0.0, 1.0);
    float isSpine = step(0.985, aSeed.z);
    vec3 surfN = normalize(vec3(xr, 0.30, max(-1.5, zr)));
    float keyL = clamp(dot(surfN, normalize(vec3(-0.48, 0.48, 0.74))), 0.0, 1.0);
    col = mix(uDeep, mix(uPetal, uBlush, smoothstep(0.22, 0.92, outer)), clamp(0.26 + 0.48 * depthFade + 0.36 * keyL, 0.0, 1.0));
    col = mix(col, white, smoothstep(0.68, 1.0, outer) * 0.42 + isSpine * 0.48 + twinkle * 0.48 + waveBoost * 0.42);
    alpha = appear * (0.44 + 0.50 * depthFade + isSpine * 0.16 + twinkle * 0.26) * (0.65 + 0.35 * u);
    size = (1.15 + aSeed.w * 1.75 + smoothstep(0.76, 1.0, outer) * 0.45 + twinkle * 0.95 + waveBoost * 0.55) * persp;
    shape = (aSeed.z > 0.955 && isSpine < 0.5) ? 2.0 : 0.0;
  } else if (role < 1.5) {
    // Tapered silk-organza 3D spiral ribbon + diamond-dust edge filaments!
    float core = 1.0 - clamp(aSeed.z, 0.0, 1.0);
    col = mix(uBlush, white, 0.62 + 0.36 * core + twinkle * 0.24);
    alpha = appear * (0.64 + 0.34 * core) * (0.50 + 0.50 * depthFade);
    size = (1.95 + aSeed.w * 2.15 + core * 1.10 + waveBoost * 0.6) * persp;
    shape = (aSeed.x > 0.93 || aSeed.z > 0.88) ? 2.0 : 0.0;
  } else if (role < 2.5) {
    // Glowing plump 3D pink-crystal Heart Topper!
    float rim = clamp(aSeed.z, 0.0, 1.0);
    col = mix(uBlush, uHeart, 0.35 + 0.55 * rim);
    col = mix(col, white, (1.0 - rim) * 0.44 + twinkle * 0.30);
    alpha = appear * (0.76 + 0.24 * depthFade);
    size = (2.05 + aSeed.w * 2.15 + twinkle * 0.65) * persp;
    shape = aSeed.x > 0.95 ? 2.0 : 0.0;
  } else if (role < 3.5) {
    // Vast sweeping curved planetary galaxy floor & bold pink concentric rings!
    float isRing = aSeed.z;
    float distFade = 1.0 - smoothstep(5.2, 12.2, radial);
    vec3 ringCol = mix(uRing, uBlush, aSeed.y * 0.60 + twinkle * 0.32);
    col = mix(mix(white, uBlush, 0.20), ringCol, smoothstep(0.10, 0.72, isRing));
    col = mix(col, white, twinkle * 0.42 + waveBoost * 0.35);
    alpha = appear * nearClip * (0.42 + 0.54 * isRing + 0.24 * depthFade) * (0.36 + 0.64 * distFade);
    size = (1.20 + aSeed.w * 1.85 + isRing * 1.05) * min(persp, 1.85);
    shape = aSeed.x > 0.96 ? 2.0 : 0.0;
  } else {
    // 3D volumetric snow & crisp luminous foreground white bokeh orbs (reference signature!)
    float isOrb = aSeed.z;
    col = mix(white, uBlush, aSeed.y * 0.16);
    alpha = appear * nearClip * (isOrb > 0.5 ? (0.78 + 0.20 * twinkle) : (0.34 + 0.58 * depthFade));
    size = (isOrb > 0.5 ? (5.4 + aSeed.w * 6.8) : (1.05 + aSeed.w * 1.95)) * min(persp, 2.0);
    shape = isOrb > 0.5 ? 1.0 : 0.0;
  }

  // Keep white-blush color continuity during melt flight
  if (role < 3.5) {
    vec3 flightCol = aSource.w < 0.15 ? vec3(0.86, 0.92, 1.0) : mix(uBlush, white, 0.5);
    col = mix(flightCol, col, smoothstep(0.42, 0.96, u));
  }

  gl_PointSize = max(1.15, size * unit / 66.0);
  vCol = vec4(col, clamp(alpha, 0.0, 1.0));
  vShape = shape;
  vSpin = aSeed.y * TAU + clock * 0.35;
}`;

const FRAGMENT = `
precision mediump float;
varying vec4 vCol;
varying float vShape;
varying float vSpin;

void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = length(p);
  if (d > 1.0) discard;

  float shape = 0.0;
  if (vShape > 1.5) {
    // Crisp 4-point diamond starlight glint
    float c = cos(vSpin), s = sin(vSpin);
    vec2 q = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
    float sx = exp(-abs(q.x) * 10.0) * exp(-abs(q.y) * 2.2);
    float sy = exp(-abs(q.y) * 10.0) * exp(-abs(q.x) * 2.2);
    float core = exp(-d * d * 8.0);
    shape = clamp((sx + sy) * 0.85 + core * 0.85, 0.0, 1.0) * (1.0 - smoothstep(0.80, 1.0, d));
  } else if (vShape > 0.5) {
    // Glowing soft foreground snow bokeh orb (reference style!)
    float core = exp(-d * d * 2.8);
    float rim = 1.0 - smoothstep(0.35, 1.0, d);
    shape = clamp(core * 0.72 + rim * 0.48, 0.0, 1.0);
  } else {
    // Crisp radiant crystal grain
    shape = exp(-d * d * 2.65) * (1.0 - smoothstep(0.68, 1.0, d));
  }

  float a = vCol.a * shape;
  gl_FragColor = vec4(vCol.rgb * a, a);
}`;

function openWebGL() {
  const gl = particleCanvas.getContext("webgl", {
    alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false,
    preserveDrawingBuffer: true, powerPreference: "high-performance",
  });
  if (!gl) return null;
  const program = gl.createProgram();
  for (const [type, code] of [[gl.VERTEX_SHADER, VERTEX], [gl.FRAGMENT_SHADER, FRAGMENT]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, code);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program, shader);
    gl.deleteShader(shader);
  }
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  function bindBuf(data, name, count) {
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, name);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, count, gl.FLOAT, false, 0, 0);
  }
  bindBuf(treePos, "aPos", 3);
  bindBuf(treeSeed, "aSeed", 4);
  bindBuf(sourceData, "aSource", 4);
  bindBuf(treeRole, "aRole", 1);

  gl.clearColor(0, 0, 0, 0);
  gl.enable(gl.BLEND);
  // True optical additive + luminous stacking gives the exact sparkling pink-white crystal brilliance on pure black!
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  const u = {};
  for (const name of [
    "viewport", "treeCenter", "phoneCenter", "rippleOrigin",
    "uPetal", "uBlush", "uDeep", "uHeart", "uRing",

function project(x, y, z, out) {
  const xr = x * cosView - z * sinView;
  const zr = x * sinView + z * cosView;
  const yr = y * cosTilt - zr * sinTilt;
  const zp = y * sinTilt + zr * cosTilt;
  const k = 8.4 / Math.max(2.8, 8.4 - zp);
  out.x = treeCX + xr * k * S * viewZoom;
  out.y = treeCY - yr * k * S * viewZoom;
  out.z = zp; out.k = k;
  return out;
}

const soundEngine = (() => {

      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.0062));
    }

    const g = ctx.createGain(), og = ctx.createGain(), cg = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(freq, now);
    ov.type = "triangle"; ov.frequency.setValueAtTime(freq * 2, now);
    ch.type = "sine"; ch.frequency.setValueAtTime(freq * 3, now);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vel, now + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    og.gain.setValueAtTime(0.0001, now); og.gain.exponentialRampToValueAtTime(vel * 0.22, now + 0.01); og.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.48);
    cg.gain.setValueAtTime(0.0001, now); cg.gain.exponentialRampToValueAtTime(vel * 0.08, now + 0.008); cg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.24);
    osc.connect(g); ov.connect(og); og.connect(g); ch.connect(cg); cg.connect(g); g.connect(master);

    if (step % 4 === 0) bell(scale[bass[(step / 4) % bass.length]] * 0.5, 0.34, 3.8);
    step++;

    unlock() { if (ensure()) { audioUnlocked = true; audioTipEl.classList.remove("show"); } },
    appleMsgReceive(rapid = false, index = 0) {

      const now = ctx.currentTime, lift = rapid ? 1 + (index % 5) * 0.018 : 1.0, vol = rapid ? 0.34 : 0.48;
      const osc = ctx.createOscillator(), g = ctx.createGain();

      const ng = ctx.createGain(); ng.gain.setValueAtTime(isSpace ? 1.55 : 1.35, now);

        const ng = ctx.createGain(); ng.gain.setValueAtTime(vol, t0); ng.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

        b.type = "triangle"; b.frequency.setValueAtTime(delay ? 340 : 520, t0); b.frequency.exponentialRampToValueAtTime(110, t0 + 0.022);

      const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = "sine"; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(1320, now + 0.095);
      g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(0.46, now + 0.016); g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(g); g.connect(comp); osc.start(now); osc.stop(now + 0.14);
    },
    toggle(forceOn) {

function updateAndPaintPolaroid(ctx, dt) {
  if (!polaroid.active || !polaroid.photo) return;
  polaroid.age += dt;
  const age = polaroid.age, { cardW, cardH, tilt } = polaroid;
  const cx = W * 0.50, cy = H * 0.49 + Math.sin(age * 2.2) * 3.5;

  if (age < 0.34) {
    const flashA = (1 - smooth(0.02, 0.28, age)) * 0.76;
    if (flashA > 0.01) {
      ctx.save(); ctx.fillStyle = `rgba(255, 250, 254, ${flashA.toFixed(4)})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
    const brA = pulse(0, 0.04, 0.14, 0.32, age) * 0.92;
    if (brA > 0.01) {
      const inset = mix(18, 44, smooth(0, 0.18, age)), arm = 32;
      ctx.save(); ctx.strokeStyle = `rgba(255, 245, 252, ${brA.toFixed(3)})`; ctx.lineWidth = 2.6; ctx.lineCap = "round";
      for (const [x, y, dx, dy] of [
        [inset, inset, arm, arm], [W - inset, inset, -arm, arm],
        [inset, H - inset, arm, -arm], [W - inset, H - inset, -arm, -arm],
      ]) { ctx.beginPath(); ctx.moveTo(x + dx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy); ctx.stroke(); }
      ctx.restore();
    }
  }

  const enter = smooth(0.14, 0.56, age);
  const dissolveP = smooth(2.38, 3.75, age);
  if (enter > 0.005 && dissolveP < 0.995) {
    const overshoot = 1 + 0.04 * Math.sin(Math.PI * smooth(0.14, 0.62, age));
    const sc = mix(1.22, 1.0, enter) * overshoot;
    const rot = mix(0.035, tilt, enter) + Math.sin(age * 1.4) * 0.007;

    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
    ctx.globalAlpha = enter * (1 - smooth(0.90, 1.0, dissolveP));

    if (dissolveP > 0.005) {
      const diagLen = cardW + cardH;
      const cut = mix(diagLen * 0.56, -diagLen * 0.56, dissolveP);
      ctx.beginPath();
      ctx.moveTo(-cardW, -cardH); ctx.lineTo(cardW, -cardH);
      ctx.lineTo(cardW, (cut - cardW * 0.58) / 0.42);
      ctx.lineTo((cut - cardH * 0.42) / 0.58, cardH);
      ctx.lineTo(-cardW, cardH); ctx.closePath(); ctx.clip();
    }

    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.72)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    ctx.drawImage(polaroid.photo, -cardW / 2, -cardH / 2, cardW, cardH);
    ctx.restore();

    const sheenP = smooth(0.68, 1.85, age);
    if (sheenP > 0.01 && sheenP < 0.99) {
      ctx.save(); rounded(ctx, -cardW / 2, -cardH / 2, cardW, cardH, 12); ctx.clip();
      const sx = mix(-cardW * 0.9, cardW * 0.9, sheenP);
      const sg = ctx.createLinearGradient(sx - 60, -cardH / 2, sx + 60, cardH / 2);
      sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(0.5, "rgba(255,250,254,0.34)"); sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg; ctx.fillRect(-cardW / 2, -cardH / 2, cardW, cardH); ctx.restore();
    }

    if (dissolveP > 0.01 && dissolveP < 0.98) {
      const diagLen = cardW + cardH, cut = mix(diagLen * 0.56, -diagLen * 0.56, dissolveP);
      const xA = -cardW * 0.6, yA = (cut - xA * 0.58) / 0.42;
      const xB = cardW * 0.6, yB = (cut - xB * 0.58) / 0.42;
      ctx.save(); rounded(ctx, -cardW / 2, -cardH / 2, cardW, cardH, 12); ctx.clip();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(255, 224, 246, 0.88)"; ctx.lineWidth = 4.5;
      ctx.shadowColor = "#f8b8e2"; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(xA, yA); ctx.lineTo(xB, yB); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }

  const cRot = Math.cos(tilt), sRot = Math.sin(tilt);
  let alive = 0;
  ctx.save();
  for (let i = 0; i < polaroid.particles.length; i++) {
    const p = polaroid.particles[i];
    if (age < p.trigger) { alive++; continue; }
    if (!p.spawned) {
      p.spawned = true;
      p.x = cx + p.lx * cRot - p.ly * sRot;
      p.y = cy + p.lx * sRot + p.ly * cRot;
    }
    p.life += dt;
    if (p.life >= p.max) continue;
    alive++;
    const f = p.life / p.max;
    p.vx *= Math.exp(-dt * 0.72); p.vy = p.vy * Math.exp(-dt * 0.55) - 20 * dt;
    p.x += (p.vx + Math.sin(p.life * 4.2 + p.phase) * 34) * dt;
    p.y += p.vy * dt;
    const a = pulse(0, 0.08, 0.55, 1.0, f) * 0.95, r = p.size * (1 - f * 0.45);
    if (p.spark) {
      bloom(ctx, p.x, p.y, r * 2.8, i % 2 ? 1 : 0, a * 0.58);
      ctx.globalAlpha = a; drawSparkle(ctx, p.x, p.y, r * 1.4, "#fff6ff");
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = p.color; dot(ctx, p.x, p.y, r);
    }
  }
  ctx.restore();
  if (age > 4.2 && alive === 0) { polaroid.active = false; polaroid.photo = null; polaroid.particles.length = 0; }
}

function resize() {
  const rect = night.getBoundingClientRect();
  W = Math.max(1, rect.width); H = Math.max(1, rect.height);
  tall = W / H < 0.92;
  S = tall ? Math.min(H * 0.098, W * 0.172) : Math.min(H * 0.099, W * 0.082);
  CX = W * 0.50; CY = H * 0.50;
  phoneCssScale = Math.min(H * (tall ? 0.824 : 0.82) / PHONE.h, W * (tall ? 0.89 : 0.52) / (PHONE.w + 60));
  const budget = tall ? 2_400_000 : 4_200_000;
  DPR = Math.max(0.7, Math.min(devicePixelRatio || 1, 2.0, Math.sqrt(budget / (W * H)))) * (quality < 0.60 ? 0.84 : 1);
  for (const canvas of [night, particleCanvas, light]) {
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
  }
  for (const ctx of [back, front]) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintPureBlackBackdrop();

const reduced = matchMedia("(prefers-reduced-motion: reduce)");

function storyTime(position) {
  if (position < 6.2) return 14.52 * position / 6.2;
  if (position < 7.78) return mix(14.52, 15.0, (position - 6.2) / 1.58);
  if (position < 9.75) return mix(15.0, 18.4, (position - 7.78) / 1.97);
  if (position < 21.6) {
    const p = (position - 9.75) / 11.85;
    return mix(18.4, 50.0, 0.58 * p + 0.42 * p * p);
  }
  return mix(ACT.bloom, STORY_END, clamp((position - 21.6) / (FINALE_AT - 21.6)));
}

function triggerInteractiveSend() {

function state(now, dt = 0.016) {
  stageTime = now;
  t = storyTime(now);
  phase = t < ACT.firstSnow ? "letters" : t < ACT.melt ? "firstSnow" :
    t < ACT.gather ? "melt" : t < ACT.grow ? "gather" : t < ACT.bloom ? "grow" : "bloom";
  treeAlpha = smooth(24, 42, t);
  const calm = reduced.matches ? 0.48 : 1;

  const th = THEMES[activeThemeKey], tf = 1 - Math.exp(-dt * 4.2);
  lerpVec(liveTheme.petal, th.petal, tf);
  lerpVec(liveTheme.blush, th.blush, tf);
  lerpVec(liveTheme.deep,  th.deep,  tf);
  lerpVec(liveTheme.heart, th.heart, tf);
  lerpVec(liveTheme.ring,  th.ring,  tf);
  lerpVec(liveTheme.glow,  th.glow,  tf);

  if (!pointer.dragging) {
    orbit.angle += orbit.vel * dt;
    orbit.vel *= Math.exp(-dt * 3.8);
    orbit.tiltTarget *= Math.exp(-dt * 1.4);
  }
  const parallaxX = treeAlpha * (pointer.nx * 0.08 + orbit.gyroX * 0.14) * calm;
  const parallaxY = treeAlpha * (pointer.ny * 0.06 + orbit.gyroY * 0.10) * calm;
  orbit.tilt = mix(orbit.tilt, orbit.tiltTarget + parallaxY, 1 - Math.exp(-dt * 5.5));

  // True high-angle downward camera pitch (+0.34 rad = graceful elevated perspective looking DOWN onto the tree & galaxy floor!)
  const baseTilt = smooth(28, 48, t) * (tall ? 0.30 : 0.34);
  viewAngle = (0.20 + now * 0.11) * calm + orbit.angle + parallaxX;
  viewTilt = Math.max(-0.08, Math.min(0.60, baseTilt + orbit.tilt));
  cosView = Math.cos(viewAngle); sinView = Math.sin(viewAngle);
  cosTilt = Math.cos(viewTilt); sinTilt = Math.sin(viewTilt);
  viewZoom = 1.0 + 0.014 * calm * Math.sin(now * 0.12);

  // In 16:9 desktop fullscreen, glide tree gracefully to right-of-center (0.645W) & balanced vertical anchor (0.575H) so heart topper & rings fit cleanly!
  const shiftRight = smooth(38, 52, t);
  treeCX = (tall ? W * 0.50 : mix(W * 0.50, W * 0.645, shiftRight)) - (pointer.nx + orbit.gyroX) * S * 0.06 * treeAlpha;
  treeCY = (tall ? H * 0.57 : H * 0.575) - (pointer.ny + orbit.gyroY) * S * 0.04 * treeAlpha;

  beat = now < 22.0 ? 0 : clamp(mod(now - 22.0, 7.6) / 1.55);
  project(0, TREE.heartY, 0, tip);

  if (!qa) {
    audioTipEl.classList.toggle("show", !audioUnlocked && t > 0.6 && t < 16.0);
    const shouldShowHud = t >= 54;
    if (shouldShowHud !== hudActive) {
      hudActive = shouldShowHud;
      hudEl.classList.toggle("visible", hudActive);
      artEl.classList.toggle("interactive", hudActive);
      if (hudActive && !hintShown) {
        hintShown = true; hintEl.classList.add("show");
        setTimeout(() => { hintEl.classList.remove("show"); hintDismissed = true; }, 6200);
      }
    }
  }
}

function render(now, dt) {
  state(now, dt);
  pointer.strength = mix(pointer.strength, pointer.target, 1 - Math.exp(-dt * 6));
  paintPureBlackBackdrop();

function tick(stamp) {
  const delta = last === null ? 0 : (stamp - last) / 1000;
  last = stamp;
  const dt = Math.min(delta, 0.25);
  if (seek === null) {
    if (!qa && !sendGate.sent && elapsed >= 7.72 && elapsed < 7.80) {
      if (!sendGate.waiting) {
        sendGate.waiting = true; sendGate.waited = 0;
        sendPromptEl.classList.add("show"); artEl.classList.add("send-ready");
      }
      sendGate.waited += dt;
      if (sendGate.waited >= 4.2) {
        sendGate.waiting = false; sendGate.sent = true; elapsed = 7.81;
        sendPromptEl.classList.remove("show"); artEl.classList.remove("send-ready");
      }
    } else elapsed += dt * timeRate;
  }
  render(seek === null ? elapsed : seek, dt);
  if (seek === null && delta > 0 && delta < 0.25) {
    timeWindow += delta; frames++;
    if (timeWindow >= 1.9) {
      const fps = frames / timeWindow, prev = quality;
      if (fps < 34) { quality = Math.max(0.55, quality - 0.12); goodWindows = 0; }
      else if (fps > 55 && ++goodWindows >= 3) quality = Math.min(1, quality + 0.08);
      if ((prev < 0.60) !== (quality < 0.60)) changedQuality = true;
      frames = 0; timeWindow = 0;
    }
  }
  if (changedQuality) { changedQuality = false; renderedQuality = quality; resize(); }
  requestAnimationFrame(tick);
}

function decodeLetterHash() {
  try {
    const m = location.hash.match(/letter=([^&]+)/);
    if (!m) return null;
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const parsed = JSON.parse(new TextDecoder().decode(bytes));
    return parsed && typeof parsed === "object" ? parsed : null;
  } catch { return null; }
}
function encodeLetterHash(data) {
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function applyLetterToDOM(data) {
  currentLetter = {
    title: (data.title || DEFAULT_LETTER.title).trim() || DEFAULT_LETTER.title,
    salutation: (data.salutation || "").trim(),
    body: (data.body || "").trim() || DEFAULT_LETTER.body,
    time: (data.time || "").trim(),
    sign: (data.sign || "").trim(),
    seal: (data.seal || "").trim(),
  };
  letterTitleEl.textContent = currentLetter.title;
  letterSalEl.textContent = currentLetter.salutation;
  letterSalEl.style.display = currentLetter.salutation ? "" : "none";
  letterBodyEl.textContent = "";
  const paras = currentLetter.body.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
  for (const para of paras) {
    const p = document.createElement("p");
    p.textContent = para;
    letterBodyEl.appendChild(p);
  }
  letterTimeEl.textContent = currentLetter.time;
  letterSignEl.textContent = currentLetter.sign;
  letterSealEl.textContent = currentLetter.seal;
  letterSealEl.style.display = currentLetter.seal ? "" : "none";
}
function loadSavedLetter() {
  const fromHash = decodeLetterHash();
  if (fromHash) { applyLetterToDOM({ ...DEFAULT_LETTER, ...fromHash }); return; }
  try {
    const raw = localStorage.getItem(LETTER_STORAGE_KEY);
    if (raw) { applyLetterToDOM({ ...DEFAULT_LETTER, ...JSON.parse(raw) }); return; }
  } catch {}
  applyLetterToDOM(DEFAULT_LETTER);
}

addEventListener("pointerdown", e => {
  soundEngine.unlock();
  if (e.target.closest && e.target.closest("#hud, #wish-bar, #letter-backdrop")) return;
  if (sendGate.waiting) { triggerInteractiveSend(); return; }
  if (treeAlpha > 0.4) {
    pointer.dragging = true; pointer.downX = pointer.lastX = e.clientX; pointer.downY = pointer.lastY = e.clientY;
    pointer.moved = 0; artEl.classList.add("dragging");

addEventListener("pointerup", e => {
  if (pointer.dragging) {
    const wasClick = pointer.moved < 9;
    pointer.dragging = false; artEl.classList.remove("dragging");
    if (wasClick && treeAlpha > 0.45) {
      if (t >= 50 && Math.hypot(e.clientX - tip.x, e.clientY - tip.y) < Math.max(42, S * 0.52)) {
        launchWishingArc(); openLetter();

      if (!hintDismissed) { hintEl.classList.remove("show"); hintDismissed = true; }

for (const ev of ["pointercancel", "pointerout", "blur"]) {

}

for (const panel of [hudEl, wishBar]) {

  panel.addEventListener("pointerup", e => { e.stopPropagation(); });
}
function selectTheme(btn) {
  const key = btn && btn.dataset ? btn.dataset.theme : null;
  if (!key || !THEMES[key]) return;
  activeThemeKey = key;
  themeDots.forEach(d => d.classList.toggle("active", d === btn));

themeDots.forEach(btn => {

    selectTheme(btn);
  });
  btn.addEventListener("click", e => {
    e.stopPropagation();
    selectTheme(btn);
  });
});
btnLetter.addEventListener("click", openLetter);
btnLetterClose.addEventListener("click", closeLetter);
letterBackdrop.addEventListener("click", e => { if (e.target === letterBackdrop) closeLetter(); });
btnWish.addEventListener("click", () => { if (wishBar.classList.toggle("open")) setTimeout(() => wishInput.focus(), 60); });
wishBar.addEventListener("submit", e => {
  e.preventDefault();
  const word = wishInput.value.trim().slice(0, 6);
  if (!word) return;
  wishInput.value = ""; wishBar.classList.remove("open");
  flyingWishes.push({
    word, progress: 0,
    target: { word, angle: stageTime * 0.024 + (Math.random() - 0.5) * 1.1, r: 2.0 + Math.random() * 0.55, y: -0.4 + Math.random() * 1.8, custom: true },
  });
  launchWishingArc(); spawnBurst(treeCX, treeCY, 22); soundEngine.glissando();

});
btnSnap.addEventListener("click", () => triggerPolaroidSnapshot(true));
btnSound.addEventListener("click", () => {

});
btnReplay.addEventListener("click", () => {

  lastTypedKeyIdx = -1; lastMsgSoundIdx = -1; lastMsgSoundAt = 0;
  sendGate.waiting = false; sendGate.waited = 0; sendGate.sent = false;

  closeLetter(); wishBar.classList.remove("open");

});
document.addEventListener("keydown", e => {

let resizing = 0;
addEventListener("resize", () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(resize); });
