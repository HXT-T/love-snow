    :root { background: #06070f; color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #06070f; user-select: none; -webkit-user-select: none;
    }
    #art {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      touch-action: none; cursor: default;
    }
    #art.interactive { cursor: grab; }
    #art.dragging { cursor: grabbing; }
    #art.send-ready { cursor: pointer; }
    canvas {
      position: absolute; inset: 0; display: block;
      width: 100%; height: 100%; pointer-events: none;
    }
    canvas[hidden] { display: none; }

    /* Subtle Act 1 audio-unlock hint (disappears immediately on first tap or melt) */
    #audio-tip {
      position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top, 18px));
      transform: translateX(-50%) translateY(-6px);
      padding: 6px 14px; border-radius: 999px;
      background: rgba(20, 14, 32, 0.50);
      border: 1px solid rgba(255, 224, 238, 0.20);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font: 500 11.5px/1.3 "PingFang SC", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0.1em; color: rgba(255, 236, 244, 0.84);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 12;
    }
    #audio-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Interactive opening send prompt */
    #send-prompt {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 18px));
      transform: translateX(-50%) translateY(8px);
      padding: 7px 16px; border-radius: 999px;
      background: rgba(24, 15, 34, 0.56);
      border: 1px solid rgba(255, 210, 230, 0.28);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font: 500 12.5px/1.3 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.12em; color: #fff0f6;
      box-shadow: 0 8px 24px rgba(10, 5, 20, 0.48);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 12;
    }
    #send-prompt.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* Whisper-quiet museum-grade floating micro-HUD */
    #hud {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 18px));
      transform: translateX(-50%) translateY(12px);
      display: flex; align-items: center; gap: 4px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(16, 12, 28, 0.48);
      border: 1px solid rgba(255, 224, 238, 0.18);
      backdrop-filter: blur(16px) saturate(135%);
      -webkit-backdrop-filter: blur(16px) saturate(135%);
      box-shadow: 0 12px 34px rgba(4, 3, 14, 0.52), inset 0 1px 0 rgba(255, 245, 248, 0.14);
      opacity: 0; pointer-events: none;
      transition: opacity 1.1s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1);
      z-index: 15;
      max-width: calc(100vw - 20px);
    }
    #hud.visible {
      opacity: 0.68; pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    #hud.visible:hover, #hud.visible:focus-within { opacity: 0.98; }
    #hud button {
      appearance: none; border: 0; background: transparent;
      color: rgba(255, 242, 247, 0.90);
      font: 500 12px/1 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.06em;
      padding: 7px 10px; border-radius: 999px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      white-space: nowrap;
      transition: background 0.25s ease, color 0.25s ease, transform 0.18s ease;
    }
    #hud button:hover {
      background: rgba(255, 214, 232, 0.16); color: #fffaf7;
    }
    #hud button:active { transform: scale(0.95); }
    #hud button.active {
      background: rgba(246, 186, 211, 0.24); color: #fff5e2;
    }
    #hud .sep {
      width: 1px; height: 12px; flex-shrink: 0;
      background: rgba(255, 224, 236, 0.18);
    }
    .theme-dots {
      display: inline-flex; align-items: center; gap: 6px; padding: 0 6px;
    }
    .theme-dot {
      width: 12px !important; height: 12px !important; padding: 0 !important;
      border-radius: 50% !important;
      border: 1.5px solid rgba(255, 250, 252, 0.45) !important;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease !important;
    }
    .theme-dot[data-theme="sakura"] { background: radial-gradient(circle at 35% 35%, #fff0f6, #f09bbf) !important; }
    .theme-dot[data-theme="aurora"] { background: radial-gradient(circle at 35% 35%, #eef7ff, #7ebdf5) !important; }
    .theme-dot[data-theme="velvet"] { background: radial-gradient(circle at 35% 35%, #ffe6c7, #c85c7b) !important; }
    .theme-dot.active {
      transform: scale(1.22);
      border-color: #fffaf5 !important;
      box-shadow: 0 0 10px rgba(255, 232, 220, 0.85);
    }

    #hint {
      position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom, 18px)) + 52px);
      transform: translateX(-50%);
      font: 500 12px/1.4 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.14em;
      color: rgba(255, 236, 244, 0.72);
      text-shadow: 0 2px 14px rgba(8, 5, 18, 0.85);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity 1.3s ease;
      z-index: 11;
    }
    #hint.show { opacity: 1; }

    /* Wish floating input capsule */
    #wish-bar {
      position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom, 18px)) + 54px);
      transform: translateX(-50%) translateY(8px);
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px 6px 14px; border-radius: 999px;
      background: rgba(20, 14, 34, 0.72);
      border: 1px solid rgba(255, 224, 238, 0.28);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(4, 3, 16, 0.62);
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 18;
    }
    #wish-bar.open {
      opacity: 1; pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    #wish-input {
      appearance: none; border: 0; outline: 0; background: transparent;
      color: #fff9f5; width: 175px;
      font: 500 13px/1.3 "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0.08em;
    }
    #wish-input::placeholder { color: rgba(255, 226, 238, 0.52); }
    #wish-submit {
      appearance: none; border: 0; border-radius: 999px;
      padding: 6px 14px; cursor: pointer;
      background: linear-gradient(135deg, #f5b3cf, #e896bc);
      color: #fffaf8;
      font: 500 12px/1 "PingFang SC", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0.1em;
      box-shadow: 0 4px 14px rgba(236, 148, 190, 0.38);
      transition: transform 0.18s ease, filter 0.2s ease;
    }
    #wish-submit:hover { filter: brightness(1.08); }
    #wish-submit:active { transform: scale(0.95); }

    /* Snow Letter Modal ("雪落信笺 · 爱意落雪") */
    #letter-backdrop {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: rgba(8, 6, 18, 0.52);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.55s cubic-bezier(.22,1,.36,1);
    }
    #letter-backdrop.open { opacity: 1; pointer-events: auto; }
    #letter-card {
      position: relative;
      width: min(410px, calc(100vw - 36px));
      padding: 34px 30px 28px;
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(255, 250, 248, 0.93), rgba(252, 238, 244, 0.90) 55%, rgba(247, 230, 240, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 28px 70px rgba(6, 3, 18, 0.62), inset 0 0 0 1px rgba(214, 154, 184, 0.28);
      color: #5d3e52;
      transform: translateY(16px) scale(0.96);
      transition: transform 0.55s cubic-bezier(.22,1,.36,1);
      overflow: hidden;
    }
    #letter-backdrop.open #letter-card { transform: translateY(0) scale(1); }
    #letter-card::before {
      content: ""; position: absolute; inset: 10px;
      border-radius: 15px;
      border: 1px solid rgba(206, 146, 176, 0.28);
      pointer-events: none;
    }
    .letter-crest {
      text-align: center; margin-bottom: 14px;
      color: #c57e9f; font-size: 13px; letter-spacing: 0.25em;
    }
    .letter-couple {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 8px;
    }
    .letter-av {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 2px solid #fff8fb;
      box-shadow: 0 4px 14px rgba(186, 114, 152, 0.28);
    }
    .letter-heart {
      font-size: 14px; color: #d87ba3; letter-spacing: 0;
      text-shadow: 0 0 10px rgba(235, 148, 188, 0.65);
    }
    .letter-crest-title {
      display: block; margin-top: 6px;
      font: 400 24px/1.2 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "Noto Serif CJK SC", serif;
      letter-spacing: 0.28em; color: #7a4c66;
    }
    .letter-salutation {
      font: 500 16px/1.8 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      color: #6b435a; margin: 10px 0 8px;
    }
    .letter-body {
      font: 400 15.5px/1.95 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "Noto Serif CJK SC", serif;
      color: #5e3e52; margin: 0; letter-spacing: 0.05em;
    }
    .letter-body p { margin: 0 0 11px; }
    .letter-footer {
      margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between;
    }
    .letter-time {
      font: 500 11.5px/1.4 "PingFang SC", system-ui, sans-serif;
      color: rgba(132, 92, 114, 0.75); letter-spacing: 0.14em;
    }
    .letter-sign {
      text-align: right;
      font: 500 16.5px/1.5 "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      color: #7d4a67; letter-spacing: 0.12em;
    }
    .letter-seal {
      display: inline-block; margin-left: 8px;
      padding: 2px 6px; border-radius: 4px;
      border: 1.2px solid #c96c8e; color: #c96c8e;
      font: 500 11px/1.15 "Kaiti SC", "KaiTi", serif;
      letter-spacing: 0.1em; vertical-align: middle;
      background: rgba(218, 120, 156, 0.08);
    }
    #letter-close {
      position: absolute; top: 14px; right: 16px;
      width: 28px; height: 28px; border-radius: 50%;
      border: 0; background: rgba(164, 112, 140, 0.12);
      color: #7c5269; font-size: 15px; line-height: 28px;
      cursor: pointer; text-align: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    #letter-close:hover { background: rgba(164, 112, 140, 0.24); transform: scale(1.06); }

    /* Toast feedback for snapshot & wish */
    #toast {
      position: fixed; left: 50%; top: max(24px, env(safe-area-inset-top, 24px));
      transform: translateX(-50%) translateY(-10px);
      padding: 8px 18px; border-radius: 999px;
      background: rgba(22, 15, 36, 0.72);
      border: 1px solid rgba(255, 224, 236, 0.25);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: #fff7f4;
      font: 500 12.5px/1.3 "PingFang SC", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0.1em;
      opacity: 0; pointer-events: none; z-index: 40;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      #hud { gap: 2px; padding: 4px 6px; }
      #hud button { padding: 7px 7.5px; font-size: 11.5px; }
      .theme-dots { gap: 5px; padding: 0 4px; }
    }
  </style>
</head>
<body>
<main id="art" aria-label="爱意落雪·致宝宝。05:20的思念化为雪晶，在童话星夜城堡与雪镜之上聚成暖光奶油粉雪圣诞树。">
  <canvas id="night" aria-hidden="true"></canvas>
  <canvas id="particles" aria-hidden="true"></canvas>
  <canvas id="light" aria-hidden="true"></canvas>

      [1, "rgba(12, 11, 24, 0)"],

  paintFireworks(back);

  // Multi-depth falling background snow
  const scale = Math.min(1.3, Math.max(0.72, H / 780));
  for (let depth = 0; depth < backgroundSnow.length; depth++) {
    const layer = backgroundSnow[depth];
    const count = Math.round(layer.length * (0.68 + quality * 0.32));
    back.fillStyle = depth === 0 ? "#cfc8da" : "#fff8f5";
    const sway = Math.min(26, W * 0.036) * (0.31 + depth * 0.35 + storm * 0.25);
    const density = mix([0.46, 0.28, 0.18][depth], 1, storm);
    for (let i = 0; i < count; i++) {
      const reveal = 1 - smooth(density - 0.12, density, i / count);
      if (reveal < 0.005) continue;
      const flake = layer[i];
      const x = mod(flake.x * (W + 42) + Math.sin(stageTime * (0.24 + depth * 0.11) + flake.phase) * sway, W + 42) - 21;
      const y = mod(flake.y * (H + 42) + stageTime * flake.pace * H, H + 42) - 21;
      const r = flake.size * scale * (1 + storm * (0.20 + depth * 0.24));
      back.globalAlpha = flake.opacity * reveal * (0.84 + storm * 0.16);
      if (depth > 0 && i % (depth === 2 ? 3 : 8) === 0) {
        const size = r * (depth === 2 ? 2.05 : 2.8);

  }

  const tg = back.createLinearGradient(fx - trunkW, fy, fx + trunkW, fy);
  tg.addColorStop(0, "#462b3f");
  tg.addColorStop(0.5, "#8b5c78");
  tg.addColorStop(1, "#43273b");
  back.fillStyle = tg;
  back.beginPath();
  back.moveTo(trunkTop.x - trunkW * 0.62, trunkTop.y);
  back.lineTo(trunkTop.x + trunkW * 0.62, trunkTop.y);
  back.lineTo(fx + trunkW * 1.05, fy - S * 0.02);
  back.lineTo(fx - trunkW * 1.05, fy - S * 0.02);
  back.closePath();
  back.fill();
  back.restore();

  back.save();
  for (let i = 0; i < floorGlints.length; i++) {
    const g = floorGlints[i];
    project(g.x * 1.18, TREE.base - 0.34, g.z * 1.18, floorPt);
    const radialFade = 1 - smooth(1.2, 3.25, Math.hypot(g.x * 1.18, g.z * 1.18));
    const tw = 0.25 + 0.75 * Math.max(0, Math.sin(stageTime * g.speed + g.phase)) ** 3;
    const a = floorA * radialFade * tw * 0.85;
    if (a < 0.02) continue;
    const sz = g.size * floorPt.k * Math.max(0.85, S / 96);
    back.globalAlpha = a * 0.56;
    back.drawImage(sprites[g.warm ? 2 : (activeThemeKey === "aurora" ? 3 : 1)],
      floorPt.x - sz * 4.5, floorPt.y - sz * 2.2, sz * 9, sz * 4.4);
    back.globalAlpha = a;
    back.fillStyle = g.warm ? "#fff4d8" : "#fff7fb";
    dot(back, floorPt.x, floorPt.y, sz * 0.85);
  }
  back.restore();
}

function launchWishingArc() {
  wishingArcs.push({
    progress: 0,
    dur: 2.35,
    trail: [],
    startX: CX - S * 3.8,
    endX: CX + S * 3.8,
    baseY: CY - S * 2.15,
    peakLift: S * 1.55,
  });
}

function launchFirework(customX, customY) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = customX ?? (CX + side * (S * (1.85 + Math.random() * 1.85)));
  const y = customY ?? (H * (0.14 + Math.random() * 0.24));
  const count = 28 + Math.floor(Math.random() * 14);
  const warm = Math.random() < 0.58;
  const sparks = [];
  for (let i = 0; i < count; i++) {
    const ang = (i / count) * TAU + (Math.random() - 0.5) * 0.22;
    const spd = (32 + Math.random() * 68) * Math.max(0.72, S / 108);
    sparks.push({
      x, y, px: x, py: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: 0.9 + Math.random() * 1.4,
      warm: warm ? (Math.random() < 0.82) : (Math.random() < 0.25),
    });
  }
  fireworks.push({ x, y, life: 0, max: 2.35 + Math.random() * 0.75, sparks, warm });
}

function updateFairytaleSkyFX(dt) {
  if (t >= 50.5 && seek === null) {
    if (stageTime >= nextAutoArc) {
      launchWishingArc();
      nextAutoArc = stageTime + 17 + Math.random() * 7;
    }
    if (stageTime >= nextFirework) {
      launchFirework();
      nextFirework = stageTime + 4.8 + Math.random() * 4.5;
    }
  }
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.life += dt;
    if (fw.life >= fw.max) { fireworks.splice(i, 1); continue; }
    for (const sp of fw.sparks) {
      sp.px = sp.x; sp.py = sp.y;
      sp.vx *= Math.exp(-dt * 1.65);
      sp.vy = sp.vy * Math.exp(-dt * 1.55) + 22 * dt;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
    }
  }
  for (let i = wishingArcs.length - 1; i >= 0; i--) {
    const arc = wishingArcs[i];
    arc.progress += dt / arc.dur;
    if (arc.progress <= 1.02) {
      const u = clamp(arc.progress);
      const x = mix(arc.startX, arc.endX, u);
      const y = arc.baseY - Math.sin(u * Math.PI) * arc.peakLift + (u - 0.5) * S * 0.25;
      arc.headX = x; arc.headY = y;
      for (let k = 0; k < 2; k++) {
        arc.trail.push({
          x: x + (Math.random() - 0.5) * 8,
          y: y + (Math.random() - 0.5) * 8,
          vx: (Math.random() - 0.5) * 14,
          vy: 8 + Math.random() * 18,
          r: 1.5 + Math.random() * 2.5,
          life: 0, max: 0.9 + Math.random() * 0.85,
          warm: Math.random() < 0.65,
        });
      }
    }
    for (let j = arc.trail.length - 1; j >= 0; j--) {
      const p = arc.trail[j];
      p.life += dt;
      if (p.life >= p.max) { arc.trail.splice(j, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    if (arc.progress > 1.05 && !arc.trail.length) wishingArcs.splice(i, 1);
  }
}

function paintFireworks(ctx) {
  if (!fireworks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const fw of fireworks) {
    const f = fw.life / fw.max;
    const flash = (1 - smooth(0, 0.22, f)) * 0.42;
    if (flash > 0.01) bloom(ctx, fw.x, fw.y, S * 0.72, fw.warm ? 2 : 1, flash);
    const alpha = pulse(0, 0.08, 0.52, 1.0, f) * 0.62;
    for (const sp of fw.sparks) {
      const tw = 0.6 + 0.4 * Math.sin(stageTime * 16 + sp.x);
      ctx.globalAlpha = alpha * tw;
      ctx.strokeStyle = sp.warm ? "#ffebc2" : (activeThemeKey === "aurora" ? "#cdeaff" : "#ffd2e5");
      ctx.lineWidth = sp.r * 1.15;
      ctx.beginPath();
      ctx.moveTo(sp.px, sp.py);
      ctx.lineTo(sp.x, sp.y);
      ctx.stroke();
      ctx.fillStyle = "#fffaf2";
      dot(ctx, sp.x, sp.y, sp.r * 0.75);
    }
  }
  ctx.restore();
}

function paintWishingArcs(ctx) {
  if (!wishingArcs.length) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const arc of wishingArcs) {
    for (const p of arc.trail) {
      const f = p.life / p.max;
      const a = (1 - f) * (1 - f) * 0.82;
      bloom(ctx, p.x, p.y, p.r * 3.4, p.warm ? 2 : 1, a * 0.52);
      ctx.globalAlpha = a;
      drawSparkle(ctx, p.x, p.y, p.r * (1.2 - f * 0.45), p.warm ? "#fff4d8" : "#fff2f8");
    }
    if (arc.progress <= 1.0) {
      const headA = pulse(0, 0.12, 0.85, 1.0, arc.progress);
      bloom(ctx, arc.headX, arc.headY, S * 0.42, 2, headA * 0.78);
      bloom(ctx, arc.headX, arc.headY, S * 0.22, 0, headA * 0.95);
      ctx.globalAlpha = headA;
      drawSparkle(ctx, arc.headX, arc.headY, S * 0.12, "#fffdf8");
    }
  }
  ctx.restore();
}

const phoneLayer = { w: 534, h: 914, scale: 1.5, maskW: 204, maskH: 350 };
const chatFont = 27.5;
// Native CJK sans-serif first so all custom characters ("宝宝","不要离开我","永远在一起") have 100% uniform weight!
const chatFontFamily = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", "SnowChat", sans-serif';
const chatTextStyle = "500 " + chatFont + "px " + chatFontFamily;
const firstCrystalPoint = {};

function posePhone(p) {
  const floatStrength = 1 - smooth(ACT.melt - 2.0, ACT.melt + 1.5, t);
  p.x = CX;
  p.y = H * 0.478 + Math.sin(stageTime * 1.35) * 3.0 * floatStrength;
  p.rot = Math.sin(stageTime * 0.85) * 0.0045 * floatStrength;
  return p;
}
function fromPhone(x, y, point) {
  posePhone(phonePoint);
  const c = Math.cos(phonePoint.rot || 0), s = Math.sin(phonePoint.rot || 0);
  const rx = x * c - y * s, ry = x * s + y * c;
  point.x = phonePoint.x + rx * phoneCssScale;
  point.y = phonePoint.y + ry * phoneCssScale;
  return point;
}
function componentAlpha(birth, fade = 0.82) {
  return 1 - smooth(birth - fade, birth + fade, t);
}
function phoneOpacity() {
  return 1 - smooth(33.2, 36.2, t);
}
function phoneMaterialTime(x, y) {
  const height = clamp((416 - y) / 845);
  const rise = ACT.melt + 12.6 * (1 - (1 - height) ** 1.52);
  const edge = 3.0 * smooth(105, 239, Math.abs(x)) * smooth(0.05, 0.56, height);
  const crinkle = 1.10 * Math.sin(x * 0.021 + y * 0.022)
    + 0.80 * Math.sin(x * 0.039 - y * 0.028)
    + 0.36 * Math.sin(x * 0.118 + Math.sin(y * 0.079) * 1.7)
    + 0.18 * Math.sin(x * 0.262 - y * 0.218);
  return Math.max(ACT.melt - 0.1, rise - edge + crinkle);
}
function makeErosionBuffer() {
  const { w, h, scale, maskW, maskH } = phoneLayer;
  phoneLayer.raster = surface(w * scale, h * scale);
  phoneLayer.draw = phoneLayer.raster.getContext("2d");
  phoneLayer.draw.setTransform(scale, 0, 0, scale, w * scale / 2, h * scale / 2);
  phoneLayer.mask = surface(maskW, maskH);
  phoneLayer.matte = phoneLayer.mask.getContext("2d");
  phoneLayer.pixels = phoneLayer.matte.createImageData(maskW, maskH);
  phoneLayer.rimMask = surface(maskW, maskH);
  phoneLayer.rimCtx = phoneLayer.rimMask.getContext("2d");
  phoneLayer.rimPixels = phoneLayer.rimCtx.createImageData(maskW, maskH);
  phoneLayer.births = new Float32Array(maskW * maskH);
  for (let y = 0; y < maskH; y++) {
    for (let x = 0; x < maskW; x++) {
      phoneLayer.births[y * maskW + x] = phoneMaterialTime(
        (x + 0.5) * w / maskW - w / 2,
        (y + 0.5) * h / maskH - h / 2
      );
    }
  }
}
function erodedPhone() {
  const { w, h, draw, mask, matte, pixels, rimMask, rimCtx, rimPixels, births } = phoneLayer;
  draw.clearRect(-w / 2, -h / 2, w, h);
  drawPhoneContents(draw);

  const data = pixels.data;
  const rim = rimPixels.data;
  for (let i = 0; i < births.length; i++) {
    const at = births[i];
    const alpha = 1 - smooth(at - 1.15, at + 0.85, t);
    const idx = i * 4;
    data[idx + 3] = Math.round(255 * alpha);

    const edgeGlow = pulse(at - 1.55, at - 0.55, at - 0.05, at + 0.82, t);
    if (edgeGlow > 0.01) {
      rim[idx] = 255; rim[idx + 1] = 236; rim[idx + 2] = 246;
      rim[idx + 3] = Math.round(240 * edgeGlow);
    } else {
      rim[idx + 3] = 0;
    }
  }
  matte.putImageData(pixels, 0, 0);
  rimCtx.putImageData(rimPixels, 0, 0);

  draw.save();
  draw.globalCompositeOperation = "source-atop";
  draw.drawImage(rimMask, -w / 2, -h / 2, w, h);
  draw.globalCompositeOperation = "destination-in";
  draw.drawImage(mask, -w / 2, -h / 2, w, h);
  draw.restore();
  return phoneLayer.raster;
}

function roundEdge(w, h, r, steps) {
  const points = [];
  for (const [cx, cy, a] of [
    [w / 2 - r, -h / 2 + r, -Math.PI / 2],
    [w / 2 - r, h / 2 - r, 0],
    [-w / 2 + r, h / 2 - r, Math.PI / 2],
    [-w / 2 + r, -h / 2 + r, Math.PI],
  ]) {
    for (let i = 0; i <= steps; i++) {
      const angle = a + Math.PI / 2 * i / steps;
      points.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
    }
  }
  const rim = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 11));
    for (let j = 0; j < n; j++) rim.push([mix(a[0], b[0], j / n), mix(a[1], b[1], j / n)]);
  }
  return rim;
}
function drawMelodySticker(ctx, x, y, size) {
  if (melodySticker.naturalWidth) ctx.drawImage(melodySticker, x - size / 2, y - size / 2, size, size);
}
function drawAvatar(ctx, img, x, y, size, rimColor) {
  ctx.save();
  rounded(ctx, x - size / 2, y - size / 2, size, size, size * 0.34);
  ctx.save();
  ctx.clip();
  if (img && img.naturalWidth) {
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
  } else {
    ctx.fillStyle = rimColor;
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
  }
  ctx.restore();
  ctx.strokeStyle = rimColor;
  ctx.lineWidth = 1.25;
  ctx.stroke();
  ctx.restore();
}
function sampleSegment(pool, x0, y0, x1, y1, birth, material, count, jitter = 0) {
  for (let i = 0; i < count; i++) {
    const f = (i + 0.5) / count;
    const d = (Math.sin(i * 7.81 + birth) + Math.cos(i * 5.34 - birth)) * jitter;
    pool.push([mix(x0, x1, f) + d, mix(y0, y1, f) - d * 0.71, birth, material]);
  }
}

function initialUI() {
  const rng = random(19230);
  const mask = surface(422, 44);
  const ctx = mask.getContext("2d", { willReadFrequently: true });
  ctx.font = chatTextStyle;
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  for (let i = 0; i < CHAT.length; i++) {
    const [text, sent, mine] = CHAT[i];
    const y = CHAT_TOP + i * CHAT_STRIDE;
    const finalY = y - (CHAT.length - CHAT_VISIBLE) * CHAT_STRIDE;
    const w = Math.min(342, Math.max(mine ? 0 : 106, Math.ceil(ctx.measureText(text).width) + 26));

          [0, `rgba(247, 178, 210, ${(0.34 * heartBloom).toFixed(4)})`],
          [0.55, `rgba(255, 224, 198, ${(0.16 * heartBloom).toFixed(4)})`],
          [1, "rgba(255, 224, 236, 0)"],
        ]);
      }
    }

    ctx.save();
    if (i > 0 && age < 0.29) {
      const rise = smooth(0, 0.19, age);
      const scale = 0.85 + 0.15 * rise + 0.038 * Math.sin(Math.PI * smooth(0.055, 0.29, age));
      const anchor = row.mine ? row.x + row.w : row.x;
      ctx.translate(anchor, y + (1 - rise) * 7);
      ctx.scale(scale, scale);
      ctx.translate(-anchor, -y);
    }
    const flash = Math.max(
      pulse(row.birth - 0.38, row.birth - 0.06, row.birth + 0.09, row.birth + 0.58, t) * 0.72,
      row.triggered ? pulse(16.2, 17.8, 19.6, 21.4, t) * 0.38 : 0
    );
    paintChatMessage(ctx, row, y, a, flash);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function firstSnow() {
  if (t < 16.2 || t > 25.4) return;
  const row = chatRows[chatRows.length - 1];
  const lift = smooth(16.45, 20.0, t);
  const drop = smooth(20.05, 24.4, t);
  const px = mix(row.firstSnowX, PHONE.w / 2 + 20, lift) - Math.sin(lift * Math.PI) * 16 + drop * 18;
  const py = row.finalY - 88 * lift - Math.sin(lift * Math.PI) * 26 + drop * 136;
  fromPhone(px, py, firstCrystalPoint);

  const a = pulse(16.2, 16.95, 23.2, 25.4, t);
  const r = phoneCssScale * (9.2 + 11.2 * lift + drop * 3.0);

  for (let i = 1; i <= 7; i++) {
    const lt = Math.max(0, lift - i * 0.06);
    if (lt <= 0.01) continue;
    const tx = mix(row.firstSnowX, PHONE.w / 2 + 20, lt) - Math.sin(lt * Math.PI) * 16 + drop * 14;
    const ty = row.finalY - 88 * lt - Math.sin(lt * Math.PI) * 26 + drop * 124;
    const tp = fromPhone(tx, ty, {});
    const ta = a * (1 - i / 8) * 0.68 * (1 - drop * 0.7);
    bloom(front, tp.x, tp.y, r * (0.92 - i * 0.09), 1, ta * 0.62);
    front.globalAlpha = ta;
    drawSparkle(front, tp.x, tp.y, r * (0.28 - i * 0.028), "#fff8f2");
  }

  const onScreen = 1 - smooth(0.52, 0.92, lift);
  if (onScreen > 0.01) {
    glow(front, firstCrystalPoint.x, firstCrystalPoint.y, r * 3.0, r * 3.0, [
      [0, `rgba(214, 102, 152, ${(0.62 * a * onScreen).toFixed(4)})`],
      [0.42, `rgba(240, 156, 194, ${(0.30 * a * onScreen).toFixed(4)})`],
      [1, "rgba(240, 156, 194, 0)"],
    ]);
  }
  bloom(front, firstCrystalPoint.x, firstCrystalPoint.y, r * 3.1, 0, a * 0.66);
  bloom(front, firstCrystalPoint.x, firstCrystalPoint.y, r * 2.1, 1, a * 0.50);

  const rot = -0.18 + lift * 0.58 + drop * 0.28;
  front.globalAlpha = a * 0.88;
  drawCrystal(front, firstCrystalPoint.x, firstCrystalPoint.y + r * 0.07, r * 1.12, rot, 0, "#a8527d");
  front.globalAlpha = a;
  drawCrystal(front, firstCrystalPoint.x, firstCrystalPoint.y, r, rot, 0, "#fffdf9");
  front.globalAlpha = 1;
}

// 5. LUSH 13-TIER 3D FOREST, WARM FAIRY LIGHTS & DUAL-PASS WEBGL SHADERS

const boughs = [];
function makeForest() {
  const data = new Float32Array(TREE.particles * 7);
  const rng = random(612812);
  const layers = [22, 20, 19, 17, 16, 14, 13, 11, 10, 9, 7, 6, 5];
  for (let layer = 0; layer < layers.length; layer++) {
    const h = 0.042 + layer * 0.074 + Math.sin(layer * 2.34) * 0.014;
    const count = layers[layer];
    for (let j = 0; j < count; j++) {
      const angle = TAU * (j / count + layer * 0.089) + (rng() - 0.5) * 0.16;
      const length = 2.18 * (1 - h) ** 0.78
        * (0.86 + rng() * 0.24 + Math.sin(angle * 2 + layer * 1.17) * 0.078);
      boughs.push([h + (rng() - 0.5) * 0.046, angle, length, rng(), rng()]);
    }
  }
  for (let i = 0; i < TREE.particles; i++) {
    const branch = boughs[(rng() * boughs.length) | 0];
    const [h, angle, len, lift, twist] = branch;
    let p = rng() ** 0.58;
    const off = rng() - 0.5, lane = ((rng() * 12) | 0) / 12;
    const twig = i % 7 ? Math.sin(clamp(p * 1.14) * Math.PI) * (1 - p * 0.64) : 0.16;
    p = clamp(p * 0.82 + lane * 0.17);
    const r = len * p;
    const side = off * len * (twig * 0.78 + 0.14 + 0.08 * Math.sin(p * 24 + twist * 9))
      + Math.sin(p * 5 + twist * 5) * len * 0.048;
    let x = Math.cos(angle) * r - Math.sin(angle) * side;
    let z = Math.sin(angle) * r + Math.cos(angle) * side;
    let y = TREE.base + h * TREE.height + (0.16 + lift * 0.17) * (1 - p)
      - len * (0.145 + lift * 0.042) * p ** 1.88
      + (rng() - 0.5) * (0.42 * (1 - h) + 0.115) * (1.12 - p * 0.42)
      + Math.sin(p * 19 + twist * 8) * 0.072 * (1 - h);

    if (i % 14 === 0) {
      const a = rng() * TAU;
      const coreH = rng() * 0.94;
      const nearby = (0.12 + rng() * 0.42) * (1 - coreH * 0.72);
      x = Math.cos(a) * nearby; z = Math.sin(a) * nearby;
      y = TREE.base + coreH * TREE.height;
    } else if (i % 24 === 0) {
      const a = rng() * TAU, cr = rng() * 0.21;
      x = Math.cos(a) * cr; z = Math.sin(a) * cr;
      y = mix(2.22, 2.94, rng());
    }
    const index = 7 * i;
    data[index] = x; data[index + 1] = y; data[index + 2] = z;
    data[index + 3] = rng(); data[index + 4] = rng();
    data[index + 5] = rng(); data[index + 6] = rng();
  }
  return data;
}
const forest = makeForest();

const fairyLights = (() => {
  const rng = random(904412);
  return Array.from({ length: 58 }, (_, i) => {
    const h = 0.05 + (i / 58) * 0.89 + (rng() - 0.5) * 0.03;
    const angle = i * 2.39996 + rng() * 0.4;
    const r = 1.85 * (1 - h) ** 0.80 * (0.38 + rng() * 0.52);
    return {
      x: Math.cos(angle) * r, z: Math.sin(angle) * r,
      y: TREE.base + h * TREE.height - r * 0.08,
      h, phase: rng() * TAU, speed: 0.7 + rng() * 1.5,
      size: 0.65 + rng() * 0.75, warm: rng() < 0.78,
    };
  });
})();

const sourceData = new Float32Array(TREE.particles * 4);
function associateSources() {
  const rng = random(832124);
  const selected = Array.from({ length: TREE.particles }, () =>
    phoneFlecks[Math.floor(rng() * phoneFlecks.length)]);
  selected.sort((a, b) => a[2] - b[2]);
  const ranked = Array.from({ length: TREE.particles }, (_, i) => [i, forest[i * 7 + 1] + (rng() - 0.5) * 1.18]);
  ranked.sort((a, b) => a[1] - b[1]);
  for (let rank = 0; rank < selected.length; rank++) {
    const i = ranked[rank][0];
    const [x, y, birth, material] = selected[rank];
    sourceData.set([x + (rng() - 0.5) * 0.85, y + (rng() - 0.5) * 0.85, birth, material], i * 4);
  }
}

const VERTEX = `
attribute vec3 branch;
attribute vec4 seed, source;
uniform vec2 viewport, center, phoneCenter, rippleOrigin;
uniform vec3 uPetal, uBlush, uShade, uDeepShade, uGold;
uniform float unit, clock, act, turn, tilt, zoom, heart, clickWave, phoneScale, additivePass;
varying vec4 ink;
varying float vKind;
varying float vSpin;
const float TAU = 6.28318530718;

vec2 phonePoint(vec2 p) { return phoneCenter + phoneScale * p; }
vec2 cubic(vec2 a, vec2 b, vec2 c, vec2 d, float u) {
  return mix(mix(mix(a,b,u),mix(b,c,u),u),mix(mix(b,c,u),mix(c,d,u),u),u);
}

void main() {
  float h = clamp((branch.y + 2.14) / 4.88, 0.0, 1.0);
  float birth = source.z;
  float arrive = birth + (source.w < 0.5 ? 3.95 : 4.75) + h * 3.25 + seed.w * 1.50;
  float u = smoothstep(birth, arrive, act);
  vec2 origin = phonePoint(source.xy);

  vec3 settled = branch;
  float radial = length(branch.xz);
  settled.xz *= 1.0 + 0.017 * sin(clock * 1.12 + h * 6.5 + seed.w * 2.0);
  settled.y += 0.026 * sin(clock * 1.02 + branch.x * 1.7 + seed.z * 2.2);

  float c = cos(turn), s = sin(turn);
  float xr = settled.x * c - settled.z * s;
  float zr = settled.x * s + settled.z * c;
  float ct = cos(tilt), st = sin(tilt);
  float yr = settled.y * ct - zr * st;
  float zp = settled.y * st + zr * ct;
  float scale = 9.0 / (9.0 - zp);
  vec2 goal = center + vec2(xr * 1.12, -yr + zp * 0.115) * scale * unit * zoom;

  float wave = sin(u * 3.14159265);
  float spin = seed.x * TAU + clock * 0.78 + u * 9.6;
  float sweep = (seed.y - 0.43) * 1.85 + (origin.x - center.x) / unit * 0.34;
  vec2 a = origin + vec2(sweep * 0.32 + 0.16, -0.78 - seed.z * 0.56) * unit;
  vec2 b = mix(origin, goal, 0.58) + vec2(sweep, 0.52 - h * 0.36) * unit;
  vec2 wind = vec2(cos(spin) * (0.64 + seed.z * 0.94), sin(spin) * (0.19 + seed.w * 0.28));
  vec2 point = cubic(origin, a, b, goal, u) + wind * pow(max(0.0, wave), 1.3) * unit;
  gl_Position = vec4(point / viewport * vec2(2.0, -2.0) + vec2(-1.0, 1.0), 0.0, 1.0);

  float depth = clamp(0.5 + zp * 0.24, 0.0, 1.0);
  float outer = clamp(radial / (2.18 * pow(max(0.05, 1.0 - h), 0.78)), 0.0, 1.0);
  float innerGlow = (1.0 - smoothstep(0.0, 0.72, outer)) * (0.55 + 0.45 * sin(h * 11.0 + clock * 0.8));
  float sparkle = pow(max(0.0, sin(clock * (1.05 + seed.y * 2.5) + seed.x * 51.0)), 6.0);

  float ripple = max(0.0, 1.0 - abs(radial * 0.58 + abs(h - 0.39) * 0.42 - heart * 1.52) * 7.2);
  ripple *= smoothstep(0.0, 0.12, heart) * (1.0 - smoothstep(0.68, 1.0, heart));
  float clickDist = length(point - rippleOrigin) / max(1.0, unit * 2.8);
  float clickPulse = max(0.0, 1.0 - abs(clickDist - clickWave * 1.45) * 6.5);
  clickPulse *= smoothstep(0.0, 0.08, clickWave) * (1.0 - smoothstep(0.65, 1.0, clickWave));
  float totalWave = min(1.3, ripple + clickPulse * 1.25);

  vec3 white = vec3(1.0, 0.9922, 0.9882);
  vec3 iceBlue = vec3(0.84, 0.91, 1.00);
  vec3 roseGold = vec3(0.99, 0.84, 0.89);

  vec3 flightTint = source.w < 0.15 ? iceBlue : (source.w < 0.5 ? uBlush : (source.w > 1.5 ? roseGold : white));
  vec3 warmth = mix(mix(white, uPetal, smoothstep(0.05, 0.48, h)), uBlush, smoothstep(0.60, 1.0, h));
  vec3 coreShade = mix(uDeepShade, uShade, depth);
  float lightVal = 0.32 + 0.56 * depth + 0.22 * outer + 0.20 * sparkle + 0.32 * totalWave;
  vec3 color = mix(coreShade, warmth, clamp(lightVal, 0.0, 1.0));
  color = mix(color, uGold, innerGlow * 0.34 * smoothstep(34.0, 48.0, act) + totalWave * 0.32);
  color = mix(color, white, smoothstep(0.68, 1.0, outer) * (0.24 + sparkle * 0.32));
  color = mix(flightTint, color, smoothstep(0.42, 1.0, u) * smoothstep(29.0 + h * 3.5, 47.5 + h * 1.2, act));

  float isHex = step(0.952, seed.z);
  float isStar = step(0.968, seed.x) * (0.4 + 0.6 * smoothstep(0.04, 0.28, u));
  float kind = isStar > 0.5 ? 2.0 : (isHex > 0.5 ? 1.0 : 0.0);
  float appear = smoothstep(birth, birth + (source.w < 0.5 ? 0.20 : 0.45), act);
  float moving = sin(u * 3.14159265);

  if (additivePass > 0.5) {
    float glowGate = smoothstep(0.35, 1.0, u) * smoothstep(31.0, 47.0, act);
    float twinkle = 0.18 + 0.82 * sparkle + totalWave * 0.9;
    float alpha = appear * glowGate * twinkle * (0.28 + 0.46 * depth) * (seed.y > 0.55 ? 0.92 : 0.55);
    vec3 addCol = mix(uGold, white, 0.45 + 0.35 * seed.w);
    if (seed.x > 0.65) addCol = mix(uPetal, white, 0.55);
    float size = (2.1 + seed.w * 2.9 + sparkle * 2.4 + totalWave * 2.2) * scale * unit / 92.0;
    gl_PointSize = max(1.2, size);
    ink = vec4(addCol, alpha);
    vKind = seed.z > 0.45 ? 2.0 : 1.0;
    vSpin = seed.x * TAU + clock * (seed.y - 0.5) * 0.65;
  } else {
    float alpha = appear * (0.50 + seed.w * 0.46 + totalWave * 0.16) * (0.65 + 0.35 * u);
    float size = (1.12 + seed.w * 1.56 + (kind > 0.5 ? 1.55 + moving * 0.45 : 0.0) + sparkle * 0.25 + totalWave * 0.35);
    gl_PointSize = max(1.0, size * mix(0.88, scale, u) * unit / 90.0);
    ink = vec4(color, alpha);
    vKind = kind;
    vSpin = seed.y * TAU + clock * (0.22 + seed.x * 0.35) * (seed.z > 0.5 ? 1.0 : -1.0);
  }
}`;

const FRAGMENT = `
precision mediump float;
varying vec4 ink;
varying float vKind;
varying float vSpin;

void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = length(p);
  if (d > 1.0) discard;

  float c = cos(vSpin), s = sin(vSpin);
  vec2 q = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
  float soft = exp(-d * d * 3.15) * (1.0 - smoothstep(0.64, 1.0, d));

  float shape = soft;
  if (vKind > 1.5) {
    float sx = exp(-abs(q.x) * 10.5) * exp(-abs(q.y) * 2.15);
    float sy = exp(-abs(q.y) * 10.5) * exp(-abs(q.x) * 2.15);
    float core = exp(-d * d * 8.5);
    shape = clamp(max(soft * 0.55, (sx + sy) * 0.85 + core * 0.72), 0.0, 1.0) * (1.0 - smoothstep(0.78, 1.0, d));
  } else if (vKind > 0.5) {
    float a1 = abs(q.y);
    float a2 = abs(q.x * 0.8660254 + q.y * 0.5);
    float a3 = abs(-q.x * 0.8660254 + q.y * 0.5);
    float arm = min(a1, min(a2, a3));
    float hex = (1.0 - smoothstep(0.04, 0.19, arm)) * (1.0 - smoothstep(0.32, 0.96, d));
    float core = exp(-d * d * 10.0);
    shape = max(soft * 0.62, max(hex * 0.92, core));
  }

  float a = ink.a * shape;
  gl_FragColor = vec4(ink.rgb * a, a);
}`;

function openWebGL() {
  const gl = particleCanvas.getContext("webgl", {
    alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false,
    preserveDrawingBuffer: true, // ensures one-click postcard snapshot captures live WebGL pixels
    powerPreference: "high-performance",
  });
  if (!gl) return null;
  const program = gl.createProgram();
  for (const [type, code] of [[gl.VERTEX_SHADER, VERTEX], [gl.FRAGMENT_SHADER, FRAGMENT]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, code);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program, shader);
    gl.deleteShader(shader);
  }
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  function attributeBuffer(data, stride, attributes) {
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    for (const [name, count, offset] of attributes) {
      const index = gl.getAttribLocation(program, name);
      gl.enableVertexAttribArray(index);
      gl.vertexAttribPointer(index, count, gl.FLOAT, false, stride, offset);
    }
  }
  attributeBuffer(forest, 28, [["branch", 3, 0], ["seed", 4, 12]]);
  attributeBuffer(sourceData, 16, [["source", 4, 0]]);
  gl.clearColor(0, 0, 0, 0);
  gl.enable(gl.BLEND);

  const u = {};
  for (const name of [
    "viewport", "center", "phoneCenter", "rippleOrigin",
    "uPetal", "uBlush", "uShade", "uDeepShade", "uGold",
    "unit", "clock", "act", "turn", "tilt", "zoom", "heart", "clickWave", "phoneScale", "additivePass",
  ]) {
    u[name] = gl.getUniformLocation(program, name);
  }
  return {
    type: "WebGL",
    resize() { gl.viewport(0, 0, particleCanvas.width, particleCanvas.height); },
    draw() {
      gl.clear(gl.COLOR_BUFFER_BIT);
      if (t < 20.1) return;
      const p = posePhone(phonePose);
      gl.uniform2f(u.viewport, particleCanvas.width, particleCanvas.height);
      gl.uniform2f(u.center, (CX + cameraX) * DPR, (CY + cameraY) * DPR);
      gl.uniform2f(u.phoneCenter, p.x * DPR, p.y * DPR);
      gl.uniform2f(u.rippleOrigin, clickRipple.x * DPR, clickRipple.y * DPR);
      gl.uniform3fv(u.uPetal, liveTheme.petal);
      gl.uniform3fv(u.uBlush, liveTheme.blush);
      gl.uniform3fv(u.uShade, liveTheme.shade);
      gl.uniform3fv(u.uDeepShade, liveTheme.deepShade);
      gl.uniform3fv(u.uGold, liveTheme.gold);
      gl.uniform1f(u.unit, S * DPR);
      gl.uniform1f(u.phoneScale, phoneCssScale * DPR);
      gl.uniform1f(u.clock, stageTime);
      gl.uniform1f(u.act, t);
      gl.uniform1f(u.turn, viewAngle);
      gl.uniform1f(u.tilt, viewTilt);
      gl.uniform1f(u.zoom, viewZoom);
      gl.uniform1f(u.heart, beat);
      gl.uniform1f(u.clickWave, clickRipple.active ? clickRipple.progress : 1.5);

      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.uniform1f(u.additivePass, 0.0);
      gl.drawArrays(gl.POINTS, 0, Math.floor(TREE.particles * quality));

      if (t > 30.5) {
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.uniform1f(u.additivePass, 1.0);
        gl.drawArrays(gl.POINTS, 0, Math.floor(TREE.sparkleParticles * quality));
      }
    },
  };
}

function openFallback() {
  particleCanvas.hidden = true;
  fallbackCanvas.hidden = false;
  const ctx = fallbackCanvas.getContext("2d");
  const to = {}, from = {};
  const warm = ART.frost;
  const white = ART.white;
  return {
    type: "Canvas 2D",
    resize() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); },
    draw() {
      ctx.clearRect(0, 0, W, H);
      if (t < 20.1) return;
      for (let i = 0; i < TREE.fallbackParticles * quality; i++) {
        const g = i * 7, k = i * 4;
        const birth = sourceData[k + 2];
        const isMessage = sourceData[k + 3] < 0.5;
        const opacity = smooth(birth, birth + (isMessage ? 0.22 : 0.48), t);
        if (opacity < 0.004) continue;
        const bx = forest[g], by = forest[g + 1], bz = forest[g + 2];
        const a = forest[g + 3], b = forest[g + 4], c = forest[g + 5], d = forest[g + 6];
        const h = clamp((by - TREE.base) / TREE.height);
        const u = smooth(birth, birth + (isMessage ? 3.95 : 4.75) + h * 3.25 + d * 1.50, t);
        const breathe = 1 + 0.017 * Math.sin(stageTime * 1.12 + h * 6.5 + d * 2);
        project(bx * breathe, by + 0.026 * Math.sin(stageTime * 1.02 + bx * 1.7 + c * 2.2), bz * breathe, to);
        let x = to.x, y = to.y;
        if (u < 0.9998) {
          fromPhone(sourceData[k], sourceData[k + 1], from);
          const sweep = (b - 0.43) * 1.85 + (from.x - CX) / S * 0.34;
          const v = 1 - u, q0 = v * v * v, q1 = 3 * v * v * u, q2 = 3 * v * u * u, q3 = u * u * u;
          const spin = a * TAU + stageTime * 0.78 + u * 9.6;
          const arc = Math.sin(u * Math.PI) ** 1.3 * S;
          x = q0 * from.x + q1 * (from.x + (sweep * 0.32 + 0.16) * S) + q2 * (mix(from.x, to.x, 0.58) + sweep * S)
            + q3 * to.x + Math.cos(spin) * (0.64 + c * 0.94) * arc;
          y = q0 * from.y + q1 * (from.y - (0.78 + c * 0.56) * S) + q2 * (mix(from.y, to.y, 0.58) + (0.52 - h * 0.36) * S)
            + q3 * to.y + Math.sin(spin) * (0.19 + d * 0.28) * arc;
        }
        const shimmer = Math.max(0, Math.sin(stageTime * (1.05 + b * 2.5) + a * 51)) ** 6;
        const tone = Math.max(0, Math.min(4, Math.floor(1.4 + to.z * 0.72 + d * 1.68 + shimmer)));
        ctx.fillStyle = u > 0.72 && t > 34 + h * 7 ? warm[tone + (h > 0.16 ? 5 : 0)] : white;
        ctx.globalAlpha = opacity * (0.50 + d * 0.46) * (0.65 + 0.35 * u);
        const crystal = c > 0.96 || (a > 0.965 && u > 0.20 && u < 0.84);
        const size = (0.88 + d * 0.96 + (crystal ? 1.38 : 0)) * mix(0.88, to.k, u) * S / 88;
        if (crystal) {
          const r = size * 1.15;
          ctx.drawImage(sprites[4 + i % 3], x - r, y - r, r * 2, r * 2);
        } else ctx.fillRect(x - size / 2, y - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
    },
  };

      const spread = (19 + 27 * Math.sin(f * Math.PI)) * (0.52 + rng() * 0.52) * (1 - 0.46 * f);
      const reach = (17 + 26 * (1 - f)) * (0.78 + rng() * 0.4);
      const bend = (rng() - 0.5) * 10;
      c.beginPath(); c.moveTo(x, y);
      c.quadraticCurveTo(x + reach * 0.55, y + side * spread * 0.32, x + reach, y + side * spread);
      c.lineWidth = 1.45; c.strokeStyle = side < 0 ? palette.stemLight : palette.stemDark; c.stroke();

        const nx = x + reach * u + bend * Math.sin(Math.PI * u);
        const ny = y + side * spread * (0.58 * u + 0.42 * u * u);
        const len = (13.5 - 7 * u) * (0.56 + rng() * 0.72);
        const ax = nx + len * (0.40 + 0.7 * rng()), ay = ny + side * len * lean;
        const layer = Math.floor(rng() * 3);
        needles[layer].push([nx, ny, ax, ay]);
        if (side < 0 && rng() < 0.66) needles[3].push([mix(nx, ax, 0.52), mix(ny, ay, 0.52), ax, ay]);
      }

  }
  palette.needles.forEach((ink, i) => {
    c.beginPath(); c.strokeStyle = ink; c.lineWidth = [1.7, 1.38, 1.15, 1.55][i];
    for (const [x, y, ex, ey] of needles[i]) { c.moveTo(x, y); c.lineTo(ex, ey); }

  });

      const frontVis = smooth(-0.35, 0.55, projected.z);
      if (frontVis < 0.04) continue;
      const breathe = 0.68 + 0.32 * Math.sin(stageTime * 0.55 + i * 1.8) ** 2;
      const wa = a * wishFade * frontVis * breathe * 0.94;
      const baseScale = e.special || e.word.length > 2 ? 0.175 : 0.205;
      const fs = Math.max(16, S * baseScale * projected.k);

      glow(front, projected.x, projected.y, fs * (e.word.length > 2 ? 2.4 : 1.75), fs * 1.02, [
        [0, `rgba(255, 224, 206, ${(0.20 * wa).toFixed(4)})`],
        [0.45, `rgba(232, 168, 202, ${(0.10 * wa).toFixed(4)})`],
        [1, "rgba(24, 16, 36, 0)"],
      ]);
      front.font = fs.toFixed(1) + "px " + (e.kaiti || e.custom ? '"Kaiti SC", "STKaiti", KaiTi, "Songti SC", serif' : INK);
      front.shadowColor = "rgba(255, 232, 196, 0.92)";
      front.shadowBlur = 16;
      front.fillStyle = "#fffaf4";
      front.globalAlpha = wa;
      front.fillText(e.word, projected.x, projected.y);
      front.shadowBlur = 0;
    }
    front.restore();
  }
  front.globalAlpha = 1;
}

// Twin luminous companion stars gently chasing & orbiting each other around the tree ("双星相伴")
function drawTwinStars(ctx) {
  const a = smooth(44.5, 53.5, t) * treeAlpha;
  if (a < 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let s = 0; s < 2; s++) {
    const basePhase = stageTime * 0.42 + s * Math.PI;
    const h = 0.22 + 0.56 * (0.5 + 0.5 * Math.sin(stageTime * 0.19 + s * 1.4));
    const rad = 2.15 * (1 - h) ** 0.78 + 0.34;
    // Soft trailing comet beads
    for (let k = 8; k >= 0; k--) {
      const lag = k * 0.055;
      const ang = basePhase - lag;
      const lh = clamp(h - lag * 0.06 * Math.cos(stageTime * 0.19 + s * 1.4));
      const lrad = 2.15 * (1 - lh) ** 0.78 + 0.34;
      project(Math.cos(ang) * lrad, TREE.base + lh * TREE.height, Math.sin(ang) * lrad, projected);
      if (projected.z < -0.55) continue;
      const f = 1 - k / 9;
      const depthVis = smooth(-0.55, 0.45, projected.z);
      const alpha = a * f * f * depthVis * (k === 0 ? 0.92 : 0.44);
      const sz = S * projected.k * (k === 0 ? 0.055 : 0.022 * f);
      bloom(ctx, projected.x, projected.y, sz * 3.8, s === 0 ? 2 : 1, alpha * 0.72);
      if (k === 0) {
        ctx.globalAlpha = alpha;
        drawSparkle(ctx, projected.x, projected.y, sz * 1.65, s === 0 ? "#fff6de" : "#fff0f7");
      }
    }
  }
  ctx.restore();
}

function starScene() {
  project(0, TREE.apex, 0, tip);
  const a = smooth(46.8, 53.0, t);
  const radius = S * (0.225 + 0.014 * Math.sin(stageTime * 1.5));
  if (a > 0.004) {
    buildStar(front, tip.x, tip.y, radius, a);
    for (let i = 0; i < 10; i++) {
      const angle = i * TAU / 10 + stageTime * 0.20;
      const r = radius * (1.75 + 0.58 * Math.sin(stageTime * 1.15 + i * 1.4));
      const x = tip.x + Math.cos(angle) * r;
      const y = tip.y + Math.sin(angle) * r * 0.88;
      bloom(front, x, y, S * 0.056, i % 2 === 0 ? 2 : 0, a * 0.44);
      if (i % 3 === 0) {
        front.globalAlpha = a * 0.72;
        drawSparkle(front, x, y, S * 0.025, "#fff8eb");
      }
    }
  }
}

function updateAndPaintInteractiveFX(dt) {
  if (clickRipple.active) {
    clickRipple.progress += dt * 0.68;
    if (clickRipple.progress > 1.25) clickRipple.active = false;
  }
  paintWishingArcs(front);

  // Flying custom wishes ascending from bottom into the 3D calligraphy orbit!
  for (let i = flyingWishes.length - 1; i >= 0; i--) {
    const fw = flyingWishes[i];
    fw.progress += dt / 2.2;
    const u = clamp(fw.progress);
    const ease = 1 - (1 - u) ** 3;
    const ang = fw.target.angle - stageTime * 0.024;
    project(Math.cos(ang) * fw.target.r, fw.target.y, Math.sin(ang) * fw.target.r, projected);
    const x = mix(CX, projected.x, ease) + Math.sin(u * Math.PI * 2.5) * S * 0.42 * (1 - u);
    const y = mix(H - 85, projected.y, ease);
    bloom(front, x, y, S * 0.34, 2, 0.75 * (1 - u * 0.3));
    front.save();
    front.textAlign = "center"; front.textBaseline = "middle";
    front.font = Math.max(16, S * 0.18) + 'px "Kaiti SC", "STKaiti", KaiTi, serif';
    front.fillStyle = "#fffaf2";
    front.shadowColor = "rgba(255, 224, 180, 0.95)"; front.shadowBlur = 16;
    front.globalAlpha = 0.96;
    front.fillText(fw.word, x, y);
    front.restore();
    if (u >= 1) {
      etchings.push(fw.target);
      if (etchings.length > 16) etchings.splice(12, 1);
      flyingWishes.splice(i, 1);
    }
  }

  if (!cursorDust.length && !burstPieces.length) return;
  front.save();
  for (let i = cursorDust.length - 1; i >= 0; i--) {
    const d = cursorDust[i];
    d.life += dt;
    if (d.life >= d.max) { cursorDust.splice(i, 1); continue; }
    const f = d.life / d.max;
    d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 12 * dt;
    const a = (1 - f) * (1 - f) * 0.75;
    bloom(front, d.x, d.y, d.r * 3.6, d.warm ? 2 : 1, a * 0.45);
    front.globalAlpha = a;
    drawSparkle(front, d.x, d.y, d.r * (1.1 - f * 0.5), d.warm ? "#fff3d6" : "#fff4fa");
  }
  for (let i = burstPieces.length - 1; i >= 0; i--) {
    const b = burstPieces[i];
    b.life += dt;
    if (b.life >= b.max) { burstPieces.splice(i, 1); continue; }
    const f = b.life / b.max;
    b.vx *= Math.exp(-dt * 1.5);
    b.vy = b.vy * Math.exp(-dt * 1.2) + 28 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.spin * dt;
    const a = pulse(0, 0.10, 0.62, 1.0, f) * 0.92;
    if (b.star) {
      bloom(front, b.x, b.y, b.r * 2.6, b.warm ? 2 : 1, a * 0.54);
      front.globalAlpha = a;
      drawSparkle(front, b.x, b.y, b.r * 1.05, b.warm ? "#fff4dc" : "#fff5fb");
    } else {
      bloom(front, b.x, b.y, b.r * 2.2, b.warm ? 2 : 0, a * 0.48);
      front.globalAlpha = a;
      drawCrystal(front, b.x, b.y, b.r, b.rot, 0, b.warm ? "#fff4dc" : "#fffafc");
    }
  }
  front.restore();
}

// =========================================================================
// 7. STORY-SYNCED WEB AUDIO WINTER CELESTA & FAIRYTALE HARP ENGINE
// =========================================================================
const soundEngine = (() => {
  let ctx = null, playing = false, timer = null, step = 0, master = null, comp = null, keyNoiseBuf = null;
  const scale = [293.66, 329.63, 369.99, 440.00, 493.88, 554.37, 587.33, 659.25, 739.99, 880.00, 987.77, 1108.73, 1174.66];
  const melody = [6, 8, 9, 10, 9, 8, 7, 5, 6, 8, 9, 11, 10, 9, 8, 6];
  const bass = [0, 3, 4, 2];

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      // Soft limiter/compressor so rich volume never clips
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.knee.value = 12;
      comp.ratio.value = 4;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;
      comp.connect(ctx.destination);

      master = ctx.createGain();
      master.gain.value = 0.78;
      master.connect(comp);

      // Pre-bake 36ms crisp white-noise transient for unmistakable iOS Tock key click
      const len = Math.floor(ctx.sampleRate * 0.036);
      keyNoiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const ch = keyNoiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const env = Math.exp(-i / (ctx.sampleRate * 0.0062));
        ch[i] = (Math.random() * 2 - 1) * env;
      }
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }
  function bell(freq, vel = 0.44, dur = 3.0, delay = 0) {
    if (!ctx || !master) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const overtone = ctx.createOscillator();
    const chime = ctx.createOscillator();
    const g = ctx.createGain();
    const og = ctx.createGain();
    const cg = ctx.createGain();

    osc.type = "sine"; osc.frequency.setValueAtTime(freq, now);
    overtone.type = "triangle"; overtone.frequency.setValueAtTime(freq * 2, now);
    chime.type = "sine"; chime.frequency.setValueAtTime(freq * 3, now);

    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vel, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    og.gain.setValueAtTime(0.0001, now);
    og.gain.exponentialRampToValueAtTime(vel * 0.22, now + 0.01);
    og.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.48);

    cg.gain.setValueAtTime(0.0001, now);
    cg.gain.exponentialRampToValueAtTime(vel * 0.08, now + 0.008);
    cg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.24);

    osc.connect(g);
    overtone.connect(og); og.connect(g);
    chime.connect(cg); cg.connect(g);
    g.connect(master);

    osc.start(now); overtone.start(now); chime.start(now);
    osc.stop(now + dur + 0.06); overtone.stop(now + dur + 0.06); chime.stop(now + dur + 0.06);
  }
  function scheduleNext() {
    if (!playing) return;
    const idx = melody[step % melody.length];
    bell(scale[idx], 0.46, 3.0);
    if (step % 4 === 0) bell(scale[bass[(step / 4) % bass.length]] * 0.5, 0.34, 3.8);
    step++;
    timer = setTimeout(scheduleNext, step % 4 === 0 ? 1120 : 740);
  }
  return {
    unlock() {
      if (ensure()) {
        audioUnlocked = true;
        audioTipEl.classList.remove("show");
      }
    },
    // Crisp Apple iOS in-chat incoming message "bloop-ding" notification sound
    appleMsgReceive(rapid = false, index = 0) {
      if (!ctx || ctx.state !== "running" || !comp) return;
      const now = ctx.currentTime;
      // Subtle pitch shimmer during rapid cascade so bursts sound crystalline & musical
      const lift = rapid ? 1 + (index % 5) * 0.018 : 1.0;
      const vol = rapid ? 0.34 : 0.48;

      // Primary warm bubble pop-ding (G5 -> C6 glide)
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(784 * lift, now);
      osc.frequency.exponentialRampToValueAtTime(1046.5 * lift, now + 0.048);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(vol, now + 0.009);
      g.gain.exponentialRampToValueAtTime(0.001, now + (rapid ? 0.12 : 0.17));
      osc.connect(g); g.connect(comp);
      osc.start(now); osc.stop(now + 0.19);

      // Crystalline upper chime overtone
      const hi = ctx.createOscillator();
      const hg = ctx.createGain();
      hi.type = "triangle";
      hi.frequency.setValueAtTime(1568 * lift, now + 0.025);
      hi.frequency.exponentialRampToValueAtTime(2093 * lift, now + 0.065);
      hg.gain.setValueAtTime(0.0001, now + 0.025);
      hg.gain.linearRampToValueAtTime(vol * 0.28, now + 0.036);
      hg.gain.exponentialRampToValueAtTime(0.0008, now + (rapid ? 0.13 : 0.21));
      hi.connect(hg); hg.connect(comp);
      hi.start(now + 0.025); hi.stop(now + 0.23);
    },
    // Crisp, clearly audible Apple iOS keyboard "Tock" click (filtered transient + woody thump + snap)
    appleKeyClick(isSpace = false) {
      if (!ctx || ctx.state !== "running" || !keyNoiseBuf || !comp) return;
      const now = ctx.currentTime;
      const jitter = 0.96 + Math.random() * 0.08;

      // 1. Tactile broadband click burst
      const src = ctx.createBufferSource();
      src.buffer = keyNoiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.setValueAtTime((isSpace ? 1150 : 1850) * jitter, now);
      bp.Q.setValueAtTime(1.5, now);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(isSpace ? 1.55 : 1.35, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + (isSpace ? 0.028 : 0.021));
      src.connect(bp); bp.connect(ng); ng.connect(comp);
      src.start(now);

      // 2. Crisp high-frequency glass tap overtone
      const snap = ctx.createOscillator();
      const sg = ctx.createGain();
      snap.type = "sine";
      snap.frequency.setValueAtTime((isSpace ? 1950 : 2750) * jitter, now);
      snap.frequency.exponentialRampToValueAtTime(950, now + 0.009);
      sg.gain.setValueAtTime(isSpace ? 0.34 : 0.28, now);
      sg.gain.exponentialRampToValueAtTime(0.001, now + 0.012);
      snap.connect(sg); sg.connect(comp);
      snap.start(now); snap.stop(now + 0.015);

      // 3. Signature iOS woody low-mid "Tock" body resonance
      const osc = ctx.createOscillator();
      const og = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime((isSpace ? 310 : 440) * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(isSpace ? 115 : 165, now + 0.018);
      og.gain.setValueAtTime(isSpace ? 0.68 : 0.56, now);
      og.gain.exponentialRampToValueAtTime(0.001, now + 0.024);
      osc.connect(og); og.connect(comp);
      osc.start(now); osc.stop(now + 0.028);
    },
    // Clear, bright iMessage upward pop when "我也想你" is sent
    appleSendPop() {
      if (!ensure() || !comp) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.095);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.46, now + 0.016);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(g); g.connect(comp);
      osc.start(now); osc.stop(now + 0.14);
    },
    toggle(forceOn) {
      if (!ensure()) return false;
      const next = forceOn === undefined ? !playing : forceOn;
      if (next === playing) return playing;
      playing = next;
      if (playing) scheduleNext();
      else if (timer) { clearTimeout(timer); timer = null; }
      return playing;
    },
    glissando() {
      if (!ensure()) return;
      [3, 5, 6, 8, 9, 11, 12].forEach((n, i) => bell(scale[n], 0.42, 2.4, i * 0.055));
    },
    chime(normX = 0.5) {
      if (!playing || !ctx) return;
      const i = Math.max(0, Math.min(scale.length - 1, Math.floor(normX * scale.length)));
      bell(scale[i], 0.48, 2.4);
      bell(scale[Math.min(scale.length - 1, i + 2)], 0.24, 2.0, 0.04);
    },
    isOn() { return playing; },
  };
})();

// =========================================================================
function resize() {
  const rect = night.getBoundingClientRect();
  W = Math.max(1, rect.width);
  H = Math.max(1, rect.height);
  tall = W / H < 0.86;
  S = Math.min(H * 0.124, W * (tall ? 0.178 : 0.152));
  CX = W * 0.50;
  CY = H * (tall ? 0.508 : 0.526);
  phoneCssScale = Math.min(
    H * (tall ? 0.824 : 0.81) / PHONE.h,
    W * (tall ? 0.89 : 0.58) / (PHONE.w + 60)
  );
  const budget = tall ? 2_300_000 : 3_650_000;
  DPR = Math.max(0.7, Math.min(devicePixelRatio || 1, 2.1,
    Math.sqrt(budget / (W * H)))) * (quality < 0.60 ? 0.84 : 1);
  for (const canvas of [night, particleCanvas, fallbackCanvas, light]) {
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
  }
  for (const ctx of [back, front]) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintSnowfield();
  if (actor) actor.resize();
}

const reduced = matchMedia("(prefers-reduced-motion: reduce)");

function storyTime(position) {
  // 0..6.2s: accelerating "好想你" & heartfelt whispers cascade
  if (position < 6.2) return 14.52 * position / 6.2;
  // 6.2..7.78s: 1.58s animated pinyin keyboard rhythm typing "我也想你"
  if (position < 7.78) return mix(14.52, 15.0, (position - 6.2) / 1.58);
  // 7.78..9.75s: "我也想你" lands + first snowflake blooms out of "想"
  if (position < 9.75) return mix(15.0, 18.4, (position - 7.78) / 1.97);
  // 9.75..21.6s: sublimation melt, swirling gather & tree bloom
  if (position < 21.6) {
    const p = (position - 9.75) / 11.85;
    return mix(18.4, 50.0, 0.58 * p + 0.42 * p * p);
  }
  return mix(ACT.bloom, STORY_END, clamp((position - 21.6) / (FINALE_AT - 21.6)));
}

function triggerInteractiveSend() {
  if (!sendGate.waiting) return;
  sendGate.waiting = false;
  sendGate.sent = true;
  elapsed = Math.max(elapsed, 7.80);
  sendPromptEl.classList.remove("show");
  audioTipEl.classList.remove("show");
  artEl.classList.remove("send-ready");
  soundEngine.unlock();
  soundEngine.appleKeyClick(true);
  soundEngine.appleSendPop();
  setTimeout(() => soundEngine.glissando(), 120);
  const on = soundEngine.toggle(true);
  btnSound.classList.toggle("active", on);
  btnSound.textContent = on ? "♪ 雪声" : "♪ 听雪";
}

function state(now, dt = 0.016) {
  stageTime = now;
  t = storyTime(now);
  phase = t < ACT.firstSnow ? "letters" : t < ACT.melt ? "firstSnow" :
    t < ACT.gather ? "melt" : t < ACT.grow ? "gather" : t < ACT.bloom ? "grow" : "bloom";
  treeAlpha = smooth(24, 40, t);
  const calm = reduced.matches ? 0.48 : 1;

  // Smooth theme color interpolation
  const th = THEMES[activeThemeKey];
  const tf = 1 - Math.exp(-dt * 4.2);
  lerpVec(liveTheme.petal, th.petal, tf);
  lerpVec(liveTheme.blush, th.blush, tf);
  lerpVec(liveTheme.shade, th.shade, tf);
  lerpVec(liveTheme.deepShade, th.deepShade, tf);
  lerpVec(liveTheme.gold, th.gold, tf);
  lerpVec(liveTheme.aura0, th.aura0, tf);
  lerpVec(liveTheme.aura1, th.aura1, tf);
  lerpVec(liveTheme.aura2, th.aura2, tf);
  lerpVec(liveTheme.floor0, th.floor0, tf);
  lerpVec(liveTheme.floor1, th.floor1, tf);

  if (!pointer.dragging) {
    orbit.angle += orbit.vel * dt;
    orbit.vel *= Math.exp(-dt * 3.8);
    orbit.tiltTarget *= Math.exp(-dt * 1.4);
  }
  const parallaxX = treeAlpha * (pointer.nx * 0.075 + orbit.gyroX * 0.14) * calm;
  const parallaxY = treeAlpha * (pointer.ny * 0.055 + orbit.gyroY * 0.10) * calm;
  orbit.tilt = mix(orbit.tilt, orbit.tiltTarget + parallaxY, 1 - Math.exp(-dt * 5.5));

  viewAngle = (0.25 + now * 0.055 + 0.055 * Math.sin(now * 0.077)) * calm + orbit.angle + parallaxX;
  viewTilt = Math.max(-0.22, Math.min(0.22, orbit.tilt));
  cosView = Math.cos(viewAngle); sinView = Math.sin(viewAngle);
  cosTilt = Math.cos(viewTilt); sinTilt = Math.sin(viewTilt);
  viewZoom = 1 + 0.012 * calm * Math.sin(now * 0.079);
  cameraX = -(pointer.nx + orbit.gyroX) * S * 0.05 * treeAlpha * calm;
  cameraY = -(pointer.ny + orbit.gyroY) * S * 0.03 * treeAlpha * calm;

  beat = now < 22.0 ? 0 : clamp(mod(now - 22.0, 7.6) / 1.55);
  project(0, TREE.apex, 0, tip);

  if (!qa) {
    // Gentle audio unlock prompt during opening messages (auto-hides on tap or once melt begins)
    const showTip = !audioUnlocked && t > 0.6 && t < 16.0;
    audioTipEl.classList.toggle("show", showTip);

    const shouldShowHud = t >= 54;
    if (shouldShowHud !== hudActive) {
      hudActive = shouldShowHud;
      hudEl.classList.toggle("visible", hudActive);
      artEl.classList.toggle("interactive", hudActive);
      if (hudActive && !hintShown) {
        hintShown = true;
        hintEl.classList.add("show");
        setTimeout(() => { hintEl.classList.remove("show"); hintDismissed = true; }, 6200);
      }
    }
  }
}

function render(now, dt) {
  state(now, dt);
  updateFairytaleSkyFX(dt);
  pointer.strength = mix(pointer.strength, pointer.target, 1 - Math.exp(-dt * 6));
  paintSnowfield();
  paintFloorMirror();
  snow(back, false);
  displayPhone(back);
  boughLight();
  drawFirSprays();
  drawFairyLights(back, false);
  drawRibbons(back, false);
  actor.draw();

  front.clearRect(0, 0, W, H);
  drawFairyLights(front, true);
  drawRibbons(front, true);
  drawTwinStars(front);
  adorn();
  snow(front, true);
  paintFrostPieces();
  firstSnow();
  starScene();
  updateAndPaintInteractiveFX(dt);
  renderCount++;
}

let elapsed = 0, last = null, frames = 0, timeWindow = 0, goodWindows = 0, timeRate = 1;
if (qa && params.has("time") && Number.isFinite(Number(params.get("time")))) {
  seek = Math.max(0, Number(params.get("time")));
}

function tick(stamp) {
  const delta = last === null ? 0 : (stamp - last) / 1000;
  last = stamp;
  const dt = Math.min(delta, 0.25);

  if (seek === null) {
    // Interactive pause right after typing commits "我也想你" (waiting for Send tap, never in QA)
    if (!qa && !sendGate.sent && elapsed >= 7.72 && elapsed < 7.80) {
      if (!sendGate.waiting) {
        sendGate.waiting = true;
        sendGate.waited = 0;
        sendPromptEl.classList.add("show");
        artEl.classList.add("send-ready");
      }
      sendGate.waited += dt;
      if (sendGate.waited >= 4.2) {
        sendGate.waiting = false;
        sendGate.sent = true;
        elapsed = 7.81;
        sendPromptEl.classList.remove("show");
        artEl.classList.remove("send-ready");
      }
    } else {
      elapsed += dt * timeRate;
    }
  }

  render(seek === null ? elapsed : seek, dt);

  if (seek === null && delta > 0 && delta < 0.25) {
    timeWindow += delta;
    frames++;
    if (timeWindow >= 1.9) {
      const fps = frames / timeWindow;
      const previous = quality;
      if (fps < 34) {
        quality = Math.max(0.46, quality - 0.14);
        goodWindows = 0;
      } else if (fps > 55) {
        if (++goodWindows >= 3) quality = Math.min(1, quality + 0.08);
      } else {
        goodWindows = 0;
      }
      if ((previous < 0.60) !== (quality < 0.60)) changedQuality = true;
      frames = 0; timeWindow = 0;
    }
  }
  if (changedQuality) {
    changedQuality = false; renderedQuality = quality; resize();
  }
  requestAnimationFrame(tick);
}

function spawnBurst(x, y, extra = 18) {
  clickRipple.x = x; clickRipple.y = y;
  clickRipple.progress = 0; clickRipple.active = true;
  for (let i = 0; i < extra; i++) {
    const ang = (i / extra) * TAU + (Math.random() - 0.5) * 0.45;
    const spd = 42 + Math.random() * 125;
    burstPieces.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 38,
      rot: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 4.5,
      phase: Math.random() * TAU,
      r: 5 + Math.random() * 8.5,
      star: i % 3 === 0,
      warm: i % 2 === 0,
      life: 0, max: 1.45 + Math.random() * 0.95,
    });
  }
  soundEngine.chime(clamp(x / Math.max(1, W)));
}

function openLetter() {
  letterBackdrop.classList.add("open");
  wishBar.classList.remove("open");
  soundEngine.glissando();
}
function closeLetter() {
  letterBackdrop.classList.remove("open");
}

let lastDustTime = 0;
function onPointerMove(event) {
  const x = event.clientX, y = event.clientY;
  pointer.x = x; pointer.y = y; pointer.target = 1;
  pointer.nx = W ? ((x / W) - 0.5) * 2 : 0;
  pointer.ny = H ? ((y / H) - 0.5) * 2 : 0;

  if (pointer.dragging) {
    const dx = x - pointer.lastX, dy = y - pointer.lastY;
    pointer.moved += Math.hypot(dx, dy);
    orbit.angle += dx * 0.0055;
    orbit.vel = dx * 0.09;
    orbit.tiltTarget = Math.max(-0.20, Math.min(0.20, orbit.tiltTarget - dy * 0.0022));
    pointer.lastX = x; pointer.lastY = y;
  } else if (treeAlpha > 0.35 && performance.now() - lastDustTime > 42 && cursorDust.length < 48) {
    lastDustTime = performance.now();
    cursorDust.push({
      x: x + (Math.random() - 0.5) * 8,
      y: y + (Math.random() - 0.5) * 8,
      vx: (Math.random() - 0.5) * 18,
      vy: -6 - Math.random() * 14,
      r: 2.2 + Math.random() * 2.6,
      warm: Math.random() < 0.45,
      life: 0, max: 0.78 + Math.random() * 0.55,
    });
  }
}

function onPointerDown(event) {
  soundEngine.unlock();
  if (event.target.closest && event.target.closest("#hud, #wish-bar, #letter-backdrop")) return;
  pointer.x = event.clientX; pointer.y = event.clientY; pointer.target = 1;

  // Interactive opening send tap!
  if (sendGate.waiting) {
    triggerInteractiveSend();
    return;
  }

  if (treeAlpha > 0.4) {
    pointer.dragging = true;
    pointer.downX = pointer.lastX = event.clientX;
    pointer.downY = pointer.lastY = event.clientY;
    pointer.moved = 0;
    artEl.classList.add("dragging");
  }
}

function onPointerUp(event) {
  if (pointer.dragging) {
    const wasClick = pointer.moved < 9;
    pointer.dragging = false;
    artEl.classList.remove("dragging");
    if (wasClick && treeAlpha > 0.45) {
      // Check if clicking the diamond tree-topper star -> opens the Snow Letter & launches a wishing star!
      const dStar = Math.hypot(event.clientX - tip.x, event.clientY - tip.y);
      if (t >= 50 && dStar < Math.max(36, S * 0.45)) {
        launchWishingArc();
        openLetter();
      } else {
        spawnBurst(event.clientX, event.clientY);
        if (Math.random() < 0.35) launchFirework(event.clientX, Math.min(H * 0.42, event.clientY - 30));
      }
      if (!hintDismissed) { hintEl.classList.remove("show"); hintDismissed = true; }
    }
  }
  pointer.target = 0;
}

addEventListener("pointermove", onPointerMove, { passive: true });
addEventListener("pointerdown", onPointerDown, { passive: true });
addEventListener("pointerup", onPointerUp, { passive: true });
for (const ev of ["pointercancel", "pointerout", "blur"]) {
  addEventListener(ev, () => {
    pointer.dragging = false; pointer.target = 0;
    artEl.classList.remove("dragging");
  }, { passive: true });
}

// Mobile gyroscope parallax + gentle shake for sakura blizzard & fireworks
if (window.DeviceOrientationEvent) {
  addEventListener("deviceorientation", e => {
    if (e.gamma == null || e.beta == null) return;
    orbit.gyroX = clamp((e.gamma + 35) / 70) * 2 - 1;
    orbit.gyroY = clamp((e.beta - 20) / 70) * 2 - 1;
  }, { passive: true });
}
let lastShake = 0;
if (window.DeviceMotionEvent) {
  addEventListener("devicemotion", e => {
    const acc = e.accelerationIncludingGravity;
    if (!acc || treeAlpha < 0.6) return;
    const mag = Math.hypot(acc.x || 0, acc.y || 0, acc.z || 0);
    if (mag > 22 && performance.now() - lastShake > 1800) {
      lastShake = performance.now();
      spawnBurst(CX, CY - S * 0.5, 32);
      launchWishingArc();
      launchFirework();
      showToast("摇落一场漫天粉雪 ❄");
    }
  }, { passive: true });
}

// HUD bindings
themeDots.forEach(btn => {
  btn.addEventListener("click", () => {
    activeThemeKey = btn.dataset.theme;
    themeDots.forEach(d => d.classList.toggle("active", d === btn));
    showToast("已切换氛围 · " + THEMES[activeThemeKey].name);
  });
});

btnLetter.addEventListener("click", openLetter);
btnLetterClose.addEventListener("click", closeLetter);
letterBackdrop.addEventListener("click", e => {
  if (e.target === letterBackdrop) closeLetter();
});

btnWish.addEventListener("click", () => {
  const open = wishBar.classList.toggle("open");
  if (open) setTimeout(() => wishInput.focus(), 60);
});
wishBar.addEventListener("submit", e => {
  e.preventDefault();
  const word = wishInput.value.trim().slice(0, 6);
  if (!word) return;
  wishInput.value = "";
  wishBar.classList.remove("open");
  const newAngle = (stageTime * 0.024) + (Math.random() - 0.5) * 1.1;
  flyingWishes.push({
    word, progress: 0,
    target: {
      word, angle: newAngle,
      r: 1.85 + Math.random() * 0.55,
      y: -0.6 + Math.random() * 1.8,
      custom: true,
    },
  });
  launchWishingArc();
  spawnBurst(CX, CY, 22);
  soundEngine.glissando();
  showToast(`心愿「${word}」已飞入星夜 ✦`);
});

btnSnap.addEventListener("click", exportPostcard);

btnSound.addEventListener("click", () => {
  const on = soundEngine.toggle();
  btnSound.classList.toggle("active", on);
  btnSound.textContent = on ? "♪ 雪声" : "♪ 听雪";
});

btnReplay.addEventListener("click", () => {
  elapsed = 0; last = null; seek = null;
  lastTypedKeyIdx = -1; lastMsgSoundIdx = -1; lastMsgSoundAt = 0;
  sendGate.waiting = false; sendGate.waited = 0; sendGate.sent = false;
  sendPromptEl.classList.remove("show");
  artEl.classList.remove("send-ready");
  closeLetter(); wishBar.classList.remove("open");
  orbit.angle = 0; orbit.vel = 0; orbit.tilt = 0; orbit.tiltTarget = 0;
  burstPieces.length = 0; cursorDust.length = 0; wishingArcs.length = 0; fireworks.length = 0;
  nextAutoArc = 21.5; nextFirework = 24.0;
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeLetter(); wishBar.classList.remove("open"); }
});
document.addEventListener("visibilitychange", () => { last = null; });

let resizing = 0;
addEventListener("resize", () => {
  cancelAnimationFrame(resizing);
  resizing = requestAnimationFrame(resize);
});
particleCanvas.addEventListener("webglcontextlost", event => {
  event.preventDefault();
  actor = openFallback();
  actor.resize();
});
particleCanvas.addEventListener("webglcontextrestored", () => {
  try {
    const next = openWebGL();
    if (next) {
      actor = next;
      fallbackCanvas.hidden = true; particleCanvas.hidden = false;
      actor.resize();
    }
  } catch (error) {
    console.warn("The artwork will continue in Canvas 2D.", error);
  }
});

async function start() {
  try {
    await document.fonts.load('32px "SnowInk"', "温柔");
  } catch (error) {
    console.warn("The local handwriting fallback will be used.", error);
  }
  await Promise.allSettled([
    melodySticker.decode(), avatarGirl.decode(), avatarBoy.decode(),
    document.fonts.load(chatTextStyle, "宝宝"),
  ]);
  initialUI();
  associateSources();
  try {
    actor = qa && params.has("canvas") ? null : openWebGL();
  } catch (error) {
    console.warn("The artwork will continue in Canvas 2D.", error);
  }
  actor ||= openFallback();
  resize();
  if (qa) {
    window.snowQA = {
      seek(value) { seek = value; return this.stats(); },
      resume(value, rate = 1) {
        if (value !== undefined) elapsed = value;
        timeRate = Math.max(1, Math.min(12, rate));
        seek = null;
      },
      fallback() { actor = openFallback(); actor.resize(); },
      theme(key) {
        if (THEMES[key]) {
          activeThemeKey = key;
          Object.keys(liveTheme).forEach(k => { liveTheme[k] = [...THEMES[key][k]]; });
        }
      },
      openLetter() { openLetter(); },
      closeLetter() { closeLetter(); },
      wishingArc() { launchWishingArc(); launchFirework(CX - S * 2.2, H * 0.22); launchFirework(CX + S * 2.3, H * 0.25); },
      stats() {
        return {
          t, phase, stageTime, renderCount, quality, renderedQuality,
          treeAlpha, phoneAlpha: phoneOpacity(), mode: actor.type, W, H, DPR,
          font: document.fonts.check('32px "SnowInk"'),
          particles: TREE.particles, messages: chatRows.length,
          sources: phoneFlecks.length, frameSections: frameCells.length,
          visibleFrame: frameCells.filter(cell => componentAlpha(cell.birth) > 0.5).length,
          messagesSent: chatRows.filter(row => row.sent <= t).length, pointer: pointer.strength,
        };
      },
    };
  }
  requestAnimationFrame(tick);
}
resize();
start();
</script>
